name: Sounds
on: [push]
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          which ffmpeg || (pip install imageio-ffmpeg >/dev/null && mkdir -p $HOME/bin && ln -sf $(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())') $HOME/bin/ffmpeg && echo $HOME/bin >> $GITHUB_PATH)
        timeout-minutes: 5
      - run: pip install requests >/dev/null && python tools/fetch.py
      - run: bash tools/report.sh
      - name: Publish
        run: |
          cd out && git init -q -b sounds-out && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm out
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sounds-out
