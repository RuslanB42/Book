name: Catalog probe
on: [push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests >/dev/null && python tools/probe.py
        env:
          PYTHONUNBUFFERED: "1"
      - name: Publish
        run: |
          mkdir out && cp probe.json out/
          cd out && git init -q -b catalog-out && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" catalog-out
