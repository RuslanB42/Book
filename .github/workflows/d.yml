name: Dict
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p src out
          pip install orjson >/dev/null
          curl -sSL --retry 3 -o src/ru-ru.jsonl.gz https://kaikki.org/dictionary/downloads/ru/ru-extract.jsonl.gz &
          curl -sSL --retry 3 -o src/ru-en.jsonl.gz https://kaikki.org/dictionary/Russian/kaikki.org-dictionary-Russian.jsonl.gz &
          curl -sSL --retry 3 -o src/en.jsonl.gz https://kaikki.org/dictionary/English/kaikki.org-dictionary-English.jsonl.gz &
          wait; ls -la src
      - run: python3 tools/build.py
      - run: |
          ls -la out; gzip -9 -k out/dict.db; ls -la out
          gh release delete dict-v1 -R ${{ github.repository }} -y --cleanup-tag || true
          gh release create dict-v1 out/dict.db.gz -R ${{ github.repository }} -t "Словарь" -n "Офлайн-словарь: русский и английский, из Викисловаря (CC BY-SA 4.0)." --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
