name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: signing/polka-local.keystore
          key: polka-keystore-v1
      - name: Create debug keystore (original one is not in the repo)
        run: |
          mkdir -p signing
          [ -f signing/polka-local.keystore ] || keytool -genkeypair -keystore signing/polka-local.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -n -i -B1 -A3 "error:\|^e: \|FAILED\|What went wrong\|Could not" build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle::$msg"
            tail -25 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | xargs -0 -I{} echo "::error title=tail::{}"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: Polka-native-0.6.40
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to apk-out branch
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/debug/*.apk /tmp/out/Polka-native-0.6.40.apk
          cd /tmp/out && git init -q && git checkout -q -b apk-out && git add . 
          git -c user.name=ci -c user.email=ci@example.com commit -qm "APK 0.6.40"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-out
      - name: Unit tests
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set +e
          ./gradlew testDebugUnitTest --no-daemon --console=plain > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -i -B1 -A4 "FAILED\|What went wrong\|error:" test.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Tests::$msg"
          else
            echo "::notice title=Tests::all unit tests passed"
          fi
          exit $code
