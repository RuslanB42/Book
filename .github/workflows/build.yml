name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: signing/polka-local.keystore
          key: polka-keystore-v1
      - name: Create debug keystore (original one is not in the repo)
        run: |
          mkdir -p signing
          [ -f signing/polka-local.keystore ] || keytool -genkeypair -keystore signing/polka-local.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -n -i -B1 -A3 "error:\|^e: \|FAILED\|What went wrong\|Could not" build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle::$msg"
            tail -25 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | xargs -0 -I{} echo "::error title=tail::{}"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: Polka-native-1.2.56
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to apk-out branch
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/debug/*.apk /tmp/out/Polka-native-1.2.56.apk
          cd /tmp/out && git init -q && git checkout -q -b apk-out && git add . 
          git -c user.name=ci -c user.email=ci@example.com commit -qm "APK 1.2.56"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-out
      - name: Unit tests
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set +e
          ./gradlew testDebugUnitTest --no-daemon --console=plain > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -i -B1 -A9 "FAILED\|What went wrong\|error:" test.log | head -90 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Tests::$msg"
          else
            echo "::notice title=Tests::all unit tests passed"
          fi
          exit $code
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screens
          path: qa/
          retention-days: 3
          if-no-files-found: ignore
      - name: Publish QA screenshots to qa-out branch
        if: always()
        run: |
          [ -d qa ] || exit 0
          mkdir -p /tmp/qa && find qa -name "*.png" -size -900k | head -400 | while read f; do mkdir -p "/tmp/qa/$(dirname "$f")"; cp "$f" "/tmp/qa/$f"; done
          cd /tmp/qa && git init -q && git checkout -q -b qa-out && git add -A && git -c user.name=ci -c user.email=ci@local commit -q -m "qa screens" && git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" qa-out
  device-text:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: signing/polka-local.keystore
          key: polka-keystore-v1
      - name: Create debug keystore
        run: |
          mkdir -p signing
          [ -f signing/polka-local.keystore ] || keytool -genkeypair -keystore signing/polka-local.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Run reader text check on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            chmod +x gradlew
            timeout 840 ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.polka.nativeapp.SpacingCheck -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --no-daemon --console=plain > device.log 2>&1 || true
            mkdir -p device-qa
            adb exec-out run-as app.polka.nativeapp tar cf - -C files/qa . > device-qa/qa.tar || true
            tar xf device-qa/qa.tar -C device-qa || true
            adb logcat -d -s POLKA_QA:I > device-qa/logcat.txt || true
            adb logcat -d -s TestRunner:* AndroidRuntime:E System.err:W > device-qa/runner.txt || true
            cp device.log device-qa/device.log || true
      - name: Report
        if: always()
        run: |
          if [ ! -s device-qa/report.txt ] && [ -s device-qa/logcat.txt ]; then cp device-qa/logcat.txt device-qa/report.txt; fi
          if [ -f device-qa/report.txt ]; then msg=$(sed 's/%/%25/g' device-qa/report.txt | awk '{printf "%s%%0A", $0}'); echo "::notice title=DeviceText::$msg"; else msg=$(tail -40 device.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=DeviceText::$msg"; fi
          [ -d device-qa ] || exit 0
          cd device-qa && git init -q && git checkout -q -b qa-device && git add -A && git -c user.name=ci -c user.email=ci@local commit -q -m "device qa" && git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" qa-device
