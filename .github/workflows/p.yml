name: Photos
on: [push]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pillow >/dev/null && python tools/get.py
        timeout-minutes: 20
      - name: Publish
        if: always()
        run: |
          cd out && git init -q -b photos-out && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm out
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photos-out
