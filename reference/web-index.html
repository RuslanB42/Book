function dayMet(k) { const d = ST.data.days[k]; return !!d && (d.met || d.ms >= goalMs()); }
function streakInfo() {
  const d = new Date();
  const todayMet = dayMet(dayKey(d));
  if (!todayMet) d.setDate(d.getDate() - 1);
  let current = 0;
  while (dayMet(dayKey(d))) { current++; d.setDate(d.getDate() - 1); }
  let best = 0, run = 0, prev = null;
  for (const k of Object.keys(ST.data.days).sort()) {
    if (!dayMet(k)) { run = 0; prev = k; continue; }
    const p = new Date(k + 'T12:00:00'); p.setDate(p.getDate() - 1);
    run = prev === dayKey(p) && run ? run + 1 : 1;
    best = Math.max(best, run); prev = k;
  }
  return { current, todayMet, best: Math.max(best, ST.data.best || 0, current) };
}
function fmtDur(ms, short) {
  const m = Math.round(ms / 60000);
  if (ms > 0 && m < 1) return short ? '<1 мин' : 'меньше минуты';
  if (m < 60) return `${m} мин`;
  const hh = Math.floor(m / 60), mm = m % 60;
  return mm ? `${hh} ч ${mm} мин` : `${hh} ч`;
}
function wpm(chars, ms) { return ms >= 60000 && chars > 300 ? Math.round(chars / CHARS_PER_WORD / (ms / 60000)) : 0; }
function totals() {
  let ms = 0, chars = 0, daysRead = 0, bestDay = 0;
  let first = 0;
  for (const [k, d] of Object.entries(ST.data.days)) { ms += d.ms; chars += d.chars; if (d.ms >= 60000) daysRead++; bestDay = Math.max(bestDay, d.ms); if (d.ms > 0) { const t = new Date(k + 'T12:00:00').getTime(); if (!first || t < first) first = t; } }
  return { ms, chars, daysRead, bestDay, first };
}

/* ---------- animation helpers ---------- */
function countUp(el, to, fmt = (v) => String(Math.round(v)), dur = 900) {
  if (reduceMotion() || !to) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(to * e);
    if (k < 1) requestAnimationFrame(step);
  };
  el.textContent = fmt(0);
  requestAnimationFrame(step);
}

function activityCard() {
  const days = profileRange;
  const goal = goalMs();
  const items = [];
  for (let i = days - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const k = dayKey(d); items.push({ d, k, ms: (ST.data.days[k] || {}).ms || 0 }); }
  const sum = items.reduce((a, x) => a + x.ms, 0);
  const max = Math.max(goal * 1.25, ...items.map((x) => x.ms));
  const wd = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  const fmtD = (d) => `${wd[d.getDay()]}, ${d.getDate()} ${['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'][d.getMonth()]}`;
  const tip = h('div', { class: 'ctip', hidden: true });
  const plot = h('div', { class: 'plot', style: `--n:${days}` });
  const goalY = (goal / max) * 100;
  plot.append(h('div', { class: 'goal-line', style: `bottom:${goalY}%` }, h('span', null, `цель ${ST.data.goal} мин`)));
  items.forEach((x, i) => {
    const col = h('button', { class: 'col' + (x.ms >= goal ? ' met' : '') + (i === days - 1 ? ' today' : ''), style: `--i:${i}`, 'aria-label': `${fmtD(x.d)}: ${x.ms ? fmtDur(x.ms) : 'не читали'}` },
      h('span', { class: 'barv' + (x.ms ? '' : ' zero'), style: `height:${x.ms ? Math.max(2.5, (x.ms / max) * 100) : 0}%` }));
    const show = () => {
      $$('.col.sel', plot).forEach((c) => c.classList.remove('sel'));
      col.classList.add('sel');
      tip.hidden = false;
      tip.replaceChildren(h('b', null, x.ms ? fmtDur(x.ms) : 'Не читали'), h('span', null, fmtD(x.d)));
      const pr = plot.getBoundingClientRect(), cr = col.getBoundingClientRect();
      tip.style.left = clamp(cr.left - pr.left + cr.width / 2, 50, pr.width - 50) + 'px';
    };
    col.addEventListener('pointerenter', show); col.addEventListener('focus', show); col.addEventListener('click', show);
    plot.append(col);
  });
  plot.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { tip.hidden = true; $$('.col.sel', plot).forEach((c) => c.classList.remove('sel')); } });
  const axis = h('div', { class: 'xaxis', style: `--n:${days}` }, items.map((x, i) => h('span', null, days === 7 ? wd[x.d.getDay()] : (i % 5 === 4 || i === days - 1 ? String(x.d.getDate()) : ''))));
  const seg = h('div', { class: 'seg mini', role: 'group', 'aria-label': 'Период' }, [[7, '7 дней'], [30, '30 дней']].map(([n, l]) =>
    h('button', { 'aria-pressed': String(days === n), onclick: () => { profileRange = n; const c = activityCard(); $('#activity').replaceWith(c); } }, l)));
  const empty = !sum ? h('p', { class: 'chart-empty' }, 'График заполнится, когда вы начнёте читать') : null;
  return h('section', { class: 'card pad', id: 'activity' },
    h('div', { class: 'card-h' }, h('h2', null, 'Активность'), seg),
    h('p', { class: 'sum' }, h('span', null, h('b', null, fmtDur(sum, true)), ` за ${days === 7 ? 'неделю' : '30 дней'} | в среднем ${fmtDur(sum / days, true)} в день`), trendChip(sum, sumRange(days, days * 2))),
    h('div', { class: 'chart' }, plot, tip, empty), axis);
}

async function seedSamples() {
  for (const s of SAMPLES) {
    if (state.books.some((b) => b.title === s.title && b.sample)) continue;
    const xml = sampleFb2(s);
    const res = parseFb2Text(xml);
    const now = Date.now() - (s.shelf === 'Проза' ? 1000 : 0);
    Object.assign(res.book, { id: uid(), fileName: s.id + '.fb2', size: new Blob([xml]).size, addedAt: now, openedAt: 0, progress: null, bookmarks: [], quotes: [], notes: [], shelf: s.shelf, modifiedAt: 0, edits: 0, coverChanged: false, sample: true });
    res.content.id = res.book.id;
    try { await DB.writeBatch([{ store: 'content', value: res.content }, { store: 'books', value: res.book }]); state.books.push(res.book); } catch (e) { /* storage unavailable */ }
  }
  prefs.seeded = true; savePrefs();
}

    anims.push(sheetBg.animate([{ transform: startPose }, { transform: 'none' }], { duration: 620, easing: ease }));
    anims.push(bigCover.animate([{ transform: startCover }, { transform: 'none' }], { duration: 620, easing: ease }));
    $('.fy-x-glow', panel).animate([{ opacity: 0 }, { opacity: 1 }], { duration: 520, delay: 80, easing: 'ease-out', fill: 'backwards' });
    parts.forEach((el, i) => el.animate([{ opacity: 0, transform: 'translate3d(0,22px,0)' }, { opacity: 1, transform: 'none' }], { duration: 560, delay: 150 + Math.min(i, 6) * 45, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' }));
    $('.fy-x-bar', panel).animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 260, fill: 'backwards' });
  }
  Promise.all(anims.map((a) => a.finished)).catch(() => {}).then(() => { REC.busy = false; closeBtn.focus({ preventScroll: true }); });
  const close = async () => {
    if (closing) return; closing = true; REC.busy = true;
    document.removeEventListener('keydown', onKey, true);
    for (const a of panel.getAnimations({ subtree: true })) a.finish();
    if (!rm && card.isConnected) {
      const target = card.getBoundingClientRect();
      const back = flip(cardCover, bigCover);
      const opts = { duration: 520, easing: ease, fill: 'forwards' };
      parts.forEach((el) => el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, easing: 'ease-out', fill: 'forwards' }));
      $('.fy-x-bar', panel).animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, fill: 'forwards' });
      $('.fy-x-glow', panel).animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, easing: 'ease-out', fill: 'forwards' });
      const a1 = sheetBg.animate([{ transform: 'none' }, { transform: rectPose(target) }], opts);
      bigCover.animate([{ transform: 'none' }, { transform: back }], opts);
      await a1.finished.catch(() => {});
    }
    card.style.visibility = '';
    panel.remove(); REC.busy = false;
    if (card.isConnected) card.focus({ preventScroll: true });
  };
  closeBtn.onclick = close;
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); close(); } };
  document.addEventListener('keydown', onKey, true);
  // pull down from the top to fold it back
  let pull = null;
  scroller.addEventListener('pointerdown', (e) => { if (scroller.scrollTop <= 0 && e.pointerType !== 'mouse') pull = { y: e.clientY, id: e.pointerId, d: 0 }; });
  scroller.addEventListener('pointermove', (e) => {
    if (!pull || e.pointerId !== pull.id) return;
    pull.d = Math.max(0, e.clientY - pull.y);
    if (pull.d > 0 && scroller.scrollTop <= 0) { scroller.firstChild.style.transform = `translate3d(0,${pull.d * 0.45}px,0)`; }
  });
  const pullEnd = () => { if (!pull) return; const d = pull.d; pull = null; const inner = scroller.firstChild; if (d > 110) { inner.style.transform = ''; close(); } else if (inner.style.transform) { const from = inner.style.transform; inner.style.transform = ''; if (!rm) inner.animate([{ transform: from }, { transform: 'none' }], { duration: 360, easing: 'cubic-bezier(.3,1.3,.5,1)' }); } };
  scroller.addEventListener('pointerup', pullEnd); scroller.addEventListener('pointercancel', pullEnd);
}

/* ---------- start: pick a few liked books ---------- */
function recStartList() {
  const d = REC.data, sig = recSignals();
  const order = d.b.map((b, i) => [b[7] + (b[9] && b[9].includes(d.tags.indexOf('русская литература')) ? 12 : 0) + (b[9] && b[9].includes(d.tags.indexOf('классика')) ? 4 : 0), i])
    .filter(([, i]) => !sig.has(i) && !(d.b[i][3] > 1)).sort((a, b) => b[0] - a[0]).map((x) => x[1]);
  // spread across themes: no more than two books sharing a leading theme on one page
  const pages = [], used = new Map(), pool = order.slice(0, 260);
  let page = [];
  while (pool.length && pages.length < 8) {
    const k = pool.findIndex((i) => (used.get(d.b[i][9]?.[0]) || 0) < 2); const i = pool.splice(k < 0 ? 0 : k, 1)[0];
    const th = d.b[i][9]?.[0]; used.set(th, (used.get(th) || 0) + 1); page.push(i);
    if (page.length === 12) { pages.push(page); page = []; used.clear(); }
  }
  return pages;
}
function recStart(box) {
  const pages = recStartList();
  const page = pages[REC.startPage % Math.max(1, pages.length)] || [];
  const sel = REC.startSel;
  const known = recPositive();
  const go = h('button', { class: 'btn wide primary' }, 'Подобрать книги');
  const paintGo = () => { go.textContent = sel.size ? `Подобрать книги · ${sel.size}` : 'Подобрать книги'; };
  const grid = h('div', { class: 'fy-pick fy-look' }, page.map((i) => {
    const b = recBook(i), gb = b.gb;
    const el = h('button', { class: 'fy-pk', 'aria-pressed': String(sel.has(gb)), 'aria-label': `${b.title}, ${authorsStr(b)}`, onclick: () => { sel.has(gb) ? sel.delete(gb) : sel.add(gb); el.setAttribute('aria-pressed', String(sel.has(gb))); paintGo(); if (!reduceMotion()) el.animate([{ transform: 'scale(.94)' }, { transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.34,1.5,.64,1)' }); } },
      coverEl(b), h('span', { class: 'fy-pk-t' }, b.title), h('span', { class: 'fy-pk-ok', 'aria-hidden': 'true' }));
    return el;
  }));
  go.onclick = () => { REC.st.picks = [...new Set([...REC.st.picks, ...sel])]; REC.st.onboarded = true; sel.clear(); recSave(); recPaint(box); };
  paintGo();
  box.replaceChildren(h('div', { class: 'fy-start' },
    h('h2', null, 'Какие из этих книг вам понравились?'),
    h('p', { class: 'muted' }, known ? `${known} ${plural(known, ['книгу', 'книги', 'книг'])} из вашей библиотеки мы уже учли. Отметьте ещё несколько — с них начнётся подборка.` : 'Отметьте несколько книг, которые вам нравятся, — с них начнётся подборка.'),
    grid,
    h('button', { class: 'link-btn fy-more', onclick: () => { REC.startPage++; recStart(box); } }, 'Показать другие'),
    h('div', { class: 'fy-start-go' }, go, h('button', { class: 'link-btn', onclick: () => { REC.st.onboarded = true; recSave(); recPaint(box); } }, 'Пропустить'))));
}
function recTune(box) {
  const d = REC.data;
  const lib = state.books.filter((b) => !b.sample && !b.noFile);
  const matched = lib.filter((b) => recMatch(b) >= 0).length;
  const hidden = Object.values(REC.st.sw).filter((s) => s.a === 'nope').length;
  let s;
  const body = h('div', { class: 'detail fy-tune-body' },
    h('div', { class: 'group menu-list' },
      h('button', { onclick: () => { s.close(true); REC.startSel.clear(); recStart(box); } }, icon('plus'), 'Отметить любимые книги'),
      hidden ? h('button', { onclick: () => { for (const [g, v] of Object.entries(REC.st.sw)) if (v.a === 'nope') delete REC.st.sw[g]; recSave(); s.close(true); recPaint(box); toast('Скрытые книги снова в подборке'); } }, icon('back'), `Вернуть скрытые книги · ${hidden}`) : null,
      h('button', { class: 'danger', onclick: async () => { s.close(true); if (await confirmSheet({ title: 'Начать подборку заново?', text: 'Отметки «Не то», «Читал» и выбранные любимые книги забудутся. Книги на полках останутся.', ok: 'Начать заново', danger: true })) { REC.st = { v: 1, picks: [], sw: {}, onboarded: false }; REC.hist = []; recSave(); recPaint(box); } } }, icon('trash'), 'Начать заново')),
    h('p', { class: 'muted fy-note' }, lib.length ? `Мы узнали ${matched} из ${lib.length} ${plural(lib.length, BOOKS)} вашей библиотеки. Остальных пока нет в каталоге — по ним подборка не строится.` : ''),
    h('p', { class: 'muted fy-note' }, `В каталоге ${d.b.length.toLocaleString('ru')} книг. Связи между ними посчитаны по открытым оценкам читателей (Goodbooks-10k, CC BY-SA 4.0). Подборка считается на вашем устройстве — ничего никуда не отправляется.`));
  s = openSheet({ title: 'Подборка', body });
}

/* ---------- books without a file ---------- */
async function mergeIntoWish(book, res) {
  const keep = { id: book.id, origin: 'recommendation', shelf: book.shelf, pos: book.pos, rating: book.rating, notes: book.notes, rec: book.rec, addedAt: book.addedAt, quotes: book.quotes || [] };
  const wishAnnot = book.annotation;
  const merged = Object.assign({}, book, res.book, keep);
  if (!merged.annotation) merged.annotation = wishAnnot;
  delete merged.noFile; delete merged.recPages;
  if (merged.rating == null) delete merged.rating;
  res.content.id = book.id;
  await checkImportSpace(merged, res.content);
  await DB.writeBatch([{ store: 'content', value: res.content }, { store: 'books', value: merged }]);
  for (const key of Object.keys(book)) delete book[key]; Object.assign(book, merged);
  dropCoverUrl(book.id); REC.matchCache.clear(); libraryTabCache.clear(); state.homeCache = null;
  return book;
}
function attachFileTo(book, after) {
  const inp = h('input', { type: 'file', accept: '.fb2,.zip,.epub,application/epub+zip,application/x-fictionbook+xml', hidden: true });
  inp.addEventListener('change', async () => {
    const f = inp.files[0]; inp.remove();
    if (!f) return;
    const t = toast('Добавляю файл…', { kind: 'import-progress', busy: true, timeout: 0 });
    try {
      const res = await parseFile(f);
      t.close();
      if (!recSameBook(book, res.book)) {
        const ok = await confirmSheet({ title: 'Это та же книга?', text: `В файле — «${res.book.title}»${res.book.authors.length ? ', ' + res.book.authors.join(', ') : ''}. Добавить его к «${book.title}»?`, ok: 'Добавить' });
        if (!ok) return;
      }
      await mergeIntoWish(book, res);
      if (state.tab !== 'foryou') renderLibrary(false);
      toast('Добавлено книг: 1', { kind: 'import-result' });
      if (after) after(book);
    } catch (e) { t.close(); toast('Не удалось открыть файл: ' + ((e && e.message) || 'неизвестная ошибка') + '. Подойдут FB2, FB2.ZIP и EPUB.', { tone: 'error', timeout: 6000 }); }
  });
  document.body.append(inp); inp.click();
}

// sliding selection pill for every segmented control, remembered per control
const SEGMEM = new Map();
function enhanceSeg(seg) {
  const btns = [...seg.children].filter((b) => b.tagName === 'BUTTON');
  if (!btns.length) return;
  const idx = btns.findIndex((b) => b.getAttribute('aria-pressed') === 'true' || b.getAttribute('aria-selected') === 'true');
  const key = btns.map((b) => b.textContent.trim()).join('|');
  const prev = SEGMEM.has(key) ? SEGMEM.get(key) : idx;
  seg.classList.add('pill');
  seg.style.setProperty('--n', btns.length);
  seg.style.setProperty('--idx', Math.max(0, prev));
  seg.classList.toggle('none', idx < 0);
  SEGMEM.set(key, idx);
  if (prev !== idx && idx >= 0) requestAnimationFrame(() => requestAnimationFrame(() => seg.style.setProperty('--idx', idx)));
}
new MutationObserver((list) => {
  for (const m of list) for (const n of m.addedNodes) {
    if (n.nodeType !== 1) continue;
    if (n.classList.contains('seg')) enhanceSeg(n);
    else if (n.parentElement && n.parentElement.classList.contains('seg')) enhanceSeg(n.parentElement);
    else n.querySelectorAll && n.querySelectorAll('.seg').forEach(enhanceSeg);
  }
}).observe(document.body, { childList: true, subtree: true });

(async function init() {
  applyUi();
  await acquireLibraryWriter();
  await DB.open();
  let loaded = false;
  if (DB.ok) {
    try {
      const snap = await DB.snapshot();
      validateLibrarySnapshot(snap);
      const saved = snap.meta.find(m => m.id === 'prefs');
      if (saved && saved.data) Object.assign(prefs, saved.data);
      applyUi(); state.sort = SORTS[prefs.sort] ? prefs.sort : 'manual';
      state.books = snap.books;
      const copies = await Recovery.list().catch(e => { Recovery.error = e.message; return []; });
      if (!snap.books.length && snap.meta.find(m => m.id === 'library-state')?.count !== 0 && copies.some(c => c.count > 0)) throw new Error('Основная библиотека пуста, но найдена непустая автокопия. Выберите восстановление в настройках.');
      await loadStats();
      STORE_HEALTH.lastBackup = (snap.meta.find(m => m.id === 'backup') || {}).exportedAt || null;
      DB.ready = true; loaded = true;
      if (DB.owner) {
        await migrateRecommendationShelf();
        await DB.put('meta', { id: 'prefs', data: structuredClone(prefs) });
        statsDirty = true; await flushStats();
        try { localStorage.removeItem('polka.stats.v1'); } catch (_) {}
        if (snap.content.some(c => c.id === '__stats')) await DB.del('content','__stats');
      }
    } catch (e) { DB.ready = false; storageError(e); }
  }
  if (loaded && DB.owner && !STORE_HEALTH.error && !state.books.length && !prefs.seeded) await seedSamples();
  if (DB.ok && DB.owner) protectStorage();
  Recovery.enabled = DB.ready && DB.owner;
  if (Recovery.enabled) Recovery.schedule(true);
  paintStorageBanner();
  renderLibrary(false);
  libScrollChrome();
  if (DB.ready && DB.owner) takeSharedFiles();
})();
