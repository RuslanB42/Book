    const t = e.changedTouches[0];
    d = { el, tid: t.identifier, sx: t.clientX, sy: t.clientY, px: t.clientX, py: t.clientY, lifted: false, mouse: false };
    el.classList.add('pressing');
    d.timer = setTimeout(() => { if (d && !d.lifted) { d.el.classList.remove('pressing'); try { window.getSelection().removeAllRanges(); } catch (err) { /* ignore */ } lift(); } }, HOLD);
  }, { passive: true });
  grid.addEventListener('touchmove', (e) => {
    const t = touchOf(e); if (!t) return;
    d.px = t.clientX; d.py = t.clientY;
    if (!d.lifted) {
      if (Math.hypot(d.px - d.sx, d.py - d.sy) > 10) { clearTimeout(d.timer); d.el.classList.remove('pressing'); d = null; }
      return;
    }
    if (e.cancelable) e.preventDefault();
    place(); hitTest();
  }, { passive: false });
  grid.addEventListener('touchend', (e) => { if (touchOf(e)) { d.el.classList.remove('pressing'); end(false); } });
  grid.addEventListener('touchcancel', (e) => { if (touchOf(e)) { d.el.classList.remove('pressing'); end(true); } });
  grid.addEventListener('selectstart', (e) => e.preventDefault());
  grid.addEventListener('contextmenu', (e) => e.preventDefault());
  grid.addEventListener('dragstart', (e) => e.preventDefault());
}

async function normalizeCover(file) {
  if (/^image\/(jpeg|png)$/.test(file.type) && file.size < 3 * 1048576) return file;
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / bmp.height);
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('не удалось обработать изображение'))), 'image/jpeg', 0.9));
}

/* ================= import ================= */
async function importFiles(fileList) {
  const files = [...fileList];
  if (!files.length) return;
  const t = toast(files.length > 1 ? `Добавляю 1 из ${files.length}…` : `Добавляю «${files[0].name}»…`, { busy: true, timeout: 0 });
  const added = [], failed = [], dup = [];
  const target = !state.query && state.tab === 'shelves' && state.shelf ? state.shelf : null;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (files.length > 1) t.set(`Добавляю ${i + 1} из ${files.length}…`);
    try {
      const { book, content } = await parseFile(f);
      const twin = state.books.find((b) => b.title === book.title && b.authors.join() === book.authors.join() && b.format === book.format);
      if (twin) { dup.push(book.title); continue; }
      if (target) book.shelf = target;
      await DB.put('content', content);
      await DB.put('books', book);
      book.pos = Math.min(0, ...state.books.map((x) => x.pos ?? 0)) - 1;
      await DB.put('books', book);
      state.books.push(book); added.push(book);
    } catch (e) {
      failed.push({ name: f.name, why: e && e.name === 'QuotaExceededError' ? 'на устройстве не хватает места' : (e && e.message) || 'неизвестная ошибка' });
    }
  }
  t.close();
  if (added.length) { state.query = ''; $('#q').value = ''; $('#q-clear').hidden = true; if (target) state.shelf = target; else { state.tab = added.length === 1 ? 'shelves' : 'all'; state.shelf = added.length === 1 ? added[0].shelf : null; } renderLibrary(); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
  setTimeout(() => {
    if (failed.length) toast(failed.length === 1 ? `Не удалось открыть «${failed[0].name}»: ${failed[0].why}.` : `Не удалось открыть ${failed.length} ${plural(failed.length, ['файл', 'файла', 'файлов'])}: ${failed.map((x) => x.name).join(', ')}. Поддерживаются FB2, FB2.ZIP и EPUB.`, { tone: 'error', timeout: 7000 });
    else if (added.length === 1) toast(`«${added[0].title}» на полке «${added[0].shelf}»`, { action: { label: 'Читать', fn: () => openReader(added[0]) } });
    else if (added.length) toast(`Добавлено ${added.length} ${plural(added.length, BOOKS)}`);
    else if (dup.length) toast(dup.length === 1 ? `«${dup[0]}» уже есть в библиотеке` : `Эти книги уже есть в библиотеке`);
  }, 320);
}

          h('span', { class: 'qg-count' }, String(n), icon('next', 'sm'))),

  });
  main.append(list);
}

async function openReader(book, src, jump) {

  sheets.slice().forEach((s) => s.close(true));
  R.book = book; R.content = content; R.idMap = null; R.textCache.clear(); R.editing = false; R.dirty = false;
  book.quotes = book.quotes || []; book.bookmarks = book.bookmarks || [];
  recalcLengths();
  statsStart(book, R.total);
  R.libScroll = window.scrollY;
  $('#lib').hidden = true;
  $('#profile').hidden = true;
  $('#tabbar').hidden = true;
  $('#btn-add').hidden = true;
  const rd = $('#reader');
  rd.hidden = false;
  rd.classList.remove('calm', 'editing');
  playIn(rd, 'screen-in');
  applyReaderPrefs();
  renderTop();
  const p = book.progress || { ch: 0, block: 0 };
  if (jump && jump.ch != null) goTo(clamp(jump.ch, 0, content.chapters.length - 1), jump.quote ? { quote: jump.quote } : { block: jump.block || 0 });
  else goTo(clamp(p.ch || 0, 0, content.chapters.length - 1), { block: p.block || 0, off: p.off || 0 });
  setCalm(isPaged() && !!prefs.seenReader);
  if (!prefs.seenReader) { prefs.seenReader = true; savePrefs(); }
  book.openedAt = Date.now();
  persistBook(book).catch(() => {});
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (R.book && isPaged()) relayoutKeep(); });
}

async function closeReader() {
  if (R.editing) { const ok = await leaveEditing(); if (!ok) return; }
  saveProgress();
  hideQbar();
  if (!reduceMotion()) { try { await $('#reader').animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.985)' }], { duration: 200, easing: 'ease-in' }).finished; } catch (e) { /* interrupted */ } }
  for (const u of R.imgUrls.values()) URL.revokeObjectURL(u);
  R.imgUrls.clear();
  $('#reader').hidden = true;
  $('#reader').classList.remove('paged');

  const lib = $('#lib');

  $('#tabbar').hidden = false;
  $('#btn-add').hidden = false;

function playIn(el, cls) {
  if (!el) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
}

function recalcLengths() {

  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit);

window.addEventListener('beforeunload', (e) => { if (R.editing && R.dirty) { e.preventDefault(); e.returnValue = ''; } });

document.addEventListener('keydown', (e) => {
  if ($('#reader').hidden) return;
  const mod = e.metaKey || e.ctrlKey;
  if (R.editing) {
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveEditing(); }
    else if (e.key === 'Escape' && !sheets.length) { e.preventDefault(); leaveEditing(); }
    return;
  }
  if (sheets.length || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (isPaged()) {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); nextPage(); return; }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prevPage(); return; }
  } else {
    if (e.key === 'ArrowRight' && R.ch < R.content.chapters.length - 1) { goTo(R.ch + 1, { enter: 1 }); return; }
    if (e.key === 'ArrowLeft' && R.ch > 0) { goTo(R.ch - 1, { atEnd: true }); return; }
  }
  if (e.key === 'Escape') closeReader();
});

(function slider() {
  const sl = $('#r-slider'), tip = $('#r-tip');
  const locate = (v) => {
    if (isPaged()) {
      let ch = 0, acc = 0;
      for (; ch < R.content.chapters.length; ch++) { const n = estPages(ch); if (acc + n > v) break; acc += n; }
      ch = Math.min(ch, R.content.chapters.length - 1);
      return { ch, page: v - pagesBefore(ch), label: `Стр. ${v + 1}` };
    }
    const target = (v / 1000) * R.total;
    let ch = 0; while (ch < R.cum.length - 1 && R.cum[ch + 1] <= target) ch++;
    return { ch, frac: clamp((target - R.cum[ch]) / Math.max(1, R.content.chapters[ch].len), 0, 1), label: `${Math.round(v / 10)}%` };
  };
  sl.addEventListener('input', () => {
    R.sliding = true;
    const loc = locate(+sl.value);
    sl.style.setProperty('--fill', (sl.value / sl.max) * 100 + '%');
    if (tip.hidden) { tip.hidden = false; playIn(tip, 'pop-in'); }
    tip.textContent = `${loc.label} · ${R.content.chapters[loc.ch].title}`;
  });
  sl.addEventListener('change', () => {
    const loc = locate(+sl.value);
    tip.hidden = true;
    if (isPaged()) {
      if (loc.ch === R.ch) setPage(loc.page, { animate: true });
      else goTo(loc.ch, { page: Math.max(0, loc.page), fade: true });
    } else {
      if (loc.ch !== R.ch) goTo(loc.ch);
      requestAnimationFrame(() => { const c = rc(); const top = c.getBoundingClientRect().top + window.scrollY; window.scrollTo({ top: top + loc.frac * Math.max(0, c.offsetHeight - window.innerHeight * 0.6) - topOffset(), behavior: 'instant' }); onScroll(); });
    }
    R.sliding = false;
  });
})();

/* ================= reading statistics ================= */
const ST = { data: { days: {}, books: {}, goal: 10, best: 0 }, lastTick: 0, lastAct: 0, lastPos: null };
const CHARS_PER_WORD = 6.4;     // average Russian word plus space and punctuation
const CHARS_PER_PAGE = 1800;    // a standard typescript page
const IDLE_MS = 120000;         // no taps or page turns for 2 minutes = the reader put the phone down
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const goalMs = () => (ST.data.goal || 10) * 60000;

async function loadStats() {
  let d = null;
  try { const rec = await DB.get('content', '__stats'); if (rec) d = rec.data; } catch (e) { /* fall through */ }
  if (!d) { try { d = JSON.parse(localStorage.getItem('polka.stats.v1') || 'null'); } catch (e) { d = null; } }
  if (d) ST.data = Object.assign({ days: {}, books: {}, goal: 10, best: 0 }, d);
}
const saveStats = debounce(() => {
  DB.put('content', { id: '__stats', data: ST.data }).catch(() => {});
  try { localStorage.setItem('polka.stats.v1', JSON.stringify(ST.data)); } catch (e) { /* blocked */ }
}, 1200);

function statsActivity() { ST.lastAct = Date.now(); }
function statsStart(book, totalChars) {
  const now = Date.now();
  ST.lastAct = now; ST.lastTick = now; ST.lastPos = null;
  const b = ST.data.books[book.id] || (ST.data.books[book.id] = { ms: 0, chars: 0, sessions: 0, first: now, last: now });
  b.sessions++; b.total = totalChars; b.title = book.title;
  saveStats();
}
function dayRec(k = dayKey()) { return ST.data.days[k] || (ST.data.days[k] = { ms: 0, chars: 0, books: {} }); }
function statsCredit(ms) {
  if (!R.book) return;
  const id = R.book.id, now = Date.now();
  const d = dayRec();
  const wasMet = d.met || d.ms >= goalMs();
  d.ms += ms; d.books[id] = (d.books[id] || 0) + ms;
  const b = ST.data.books[id] || (ST.data.books[id] = { ms: 0, chars: 0, sessions: 1, first: now, last: now });
  b.ms += ms; b.last = now;
  if (!wasMet && d.ms >= goalMs()) {
    d.met = true;
    const s = streakInfo().current;
    ST.data.best = Math.max(ST.data.best || 0, s);
    toast(`Цель на сегодня выполнена · ${s} ${plural(s, ['день', 'дня', 'дней'])} подряд`, { action: { label: 'Профиль', fn: () => { closeReader().then(() => openProfile()); } }, timeout: 5000 });
  }
  saveStats();
}
function statsPosition() {
  if (!R.book || !R.content) return;
  const ch = R.content.chapters[R.ch];
  const pos = R.cum[R.ch] + (ch.len || 1) * chapterFrac();
  if (ST.lastPos != null) {
    const delta = pos - ST.lastPos;
    // forward reading only; jumps through the contents or the slider are not "read"
    if (delta > 0 && delta < 12000) {
      const d = dayRec(); d.chars += delta;
      const b = ST.data.books[R.book.id]; if (b) b.chars += delta;
      saveStats();
    }
  }
  ST.lastPos = pos;
  statsActivity();
}
setInterval(() => {
  const now = Date.now();
  const dt = now - (ST.lastTick || now);
  ST.lastTick = now;
  if (!R.book || document.hidden || R.editing || $('#reader').hidden) return;
  if (now - ST.lastAct > IDLE_MS) return;
  statsCredit(Math.min(dt, 2500));
}, 1000);
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach((t) => document.addEventListener(t, () => { if (R.book) statsActivity(); }, { passive: true }));

function dayMet(k) { const d = ST.data.days[k]; return !!d && (d.met || d.ms >= goalMs()); }
function streakInfo() {
  const d = new Date();
  const todayMet = dayMet(dayKey(d));
  if (!todayMet) d.setDate(d.getDate() - 1);
  let current = 0;
  while (dayMet(dayKey(d))) { current++; d.setDate(d.getDate() - 1); }
  let best = 0, run = 0, prev = null;
  for (const k of Object.keys(ST.data.days).sort()) {
    if (!dayMet(k)) { run = 0; prev = k; continue; }
    const p = new Date(k + 'T12:00:00'); p.setDate(p.getDate() - 1);
    run = prev === dayKey(p) && run ? run + 1 : 1;
    best = Math.max(best, run); prev = k;
  }
  return { current, todayMet, best: Math.max(best, ST.data.best || 0, current) };
}
function fmtDur(ms, short) {
  const m = Math.round(ms / 60000);
  if (ms > 0 && m < 1) return short ? '<1 мин' : 'меньше минуты';
  if (m < 60) return `${m} мин`;
  const hh = Math.floor(m / 60), mm = m % 60;
  return mm ? `${hh} ч ${mm} мин` : `${hh} ч`;
}
function wpm(chars, ms) { return ms >= 60000 && chars > 300 ? Math.round(chars / CHARS_PER_WORD / (ms / 60000)) : 0; }
function totals() {
  let ms = 0, chars = 0, daysRead = 0, bestDay = 0;
  let first = 0;
  for (const [k, d] of Object.entries(ST.data.days)) { ms += d.ms; chars += d.chars; if (d.ms >= 60000) daysRead++; bestDay = Math.max(bestDay, d.ms); if (d.ms > 0) { const t = new Date(k + 'T12:00:00').getTime(); if (!first || t < first) first = t; } }
  return { ms, chars, daysRead, bestDay, first };
}

/* ---------- animation helpers ---------- */
function countUp(el, to, fmt = (v) => String(Math.round(v)), dur = 900) {
  if (reduceMotion() || !to) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(to * e);
    if (k < 1) requestAnimationFrame(step);
  };
  el.textContent = fmt(0);
  requestAnimationFrame(step);
}
const svgEl = (tag, attrs) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

let flameSeq = 0;
function flameSvg(state, num) {

  const defs = svgEl('defs', {});
  const lin = (gid, stops, x2 = '0', y2 = '1') => { const g = svgEl('linearGradient', { id: gid, x1: '0', y1: '0', x2, y2 }); for (const [o, c, a] of stops) g.append(svgEl('stop', { offset: o, 'stop-color': c, 'stop-opacity': a == null ? 1 : a })); defs.append(g); };
  const rad = (gid, stops, cx = '.5', cy = '1', r = '.75') => { const g = svgEl('radialGradient', { id: gid, cx, cy, r }); for (const [o, c, a] of stops) g.append(svgEl('stop', { offset: o, 'stop-color': c, 'stop-opacity': a })); defs.append(g); };
  lin(id + 'o', off ? [['0', '#b4b4b9'], ['1', '#5c5c61']] : [['0', '#ffc43a'], ['.45', '#ff9420'], ['1', '#ff4a12']]);

  lin(id + 'c', off ? [['0', '#ffffff'], ['1', '#dedee2']] : [['0', '#ffffff'], ['1', '#fff0c8']]);
  rad(id + 'v', off ? [['0', '#3a3a3e', '.35'], ['1', '#3a3a3e', '0']] : [['0', '#c3260a', '.55'], ['.6', '#e8400e', '.12'], ['1', '#e8400e', '0']]);
  lin(id + 'n', [['0', '#ffffff'], ['1', '#fff3e6']]);
  const shadow = svgEl('filter', { id: id + 'sh', x: '-30%', y: '-30%', width: '160%', height: '160%' });
  shadow.append(svgEl('feDropShadow', { dx: '0', dy: '2.5', stdDeviation: '2.2', 'flood-color': off ? '#000' : '#7a1d00', 'flood-opacity': '.45' }));
  defs.append(shadow);
  const OUT = 'M62 6C66 26 88 40 98 62C108 84 106 112 92 128C82 139 70 144 58 144C42 144 26 137 18 122C8 104 12 82 22 66C26 59 31 53 34 46C38 56 42 63 49 68C48 50 52 26 62 6Z';
  const g = svgEl('g', { class: 'fbody' });
  const outer = svgEl('path', { class: 'fo', fill: `url(#${id}o)`, d: OUT });
  const vol = svgEl('path', { class: 'fv', fill: `url(#${id}v)`, d: OUT });
  const rim = svgEl('path', { class: 'fr', fill: 'none', stroke: off ? 'rgba(255,255,255,.18)' : 'rgba(255,236,190,.55)', 'stroke-width': '1.6', d: 'M62 9C66 27 87 41 96 62' , 'stroke-linecap': 'round' });
  const shine = svgEl('path', { class: 'fs', fill: 'none', stroke: 'rgba(255,255,255,.5)', 'stroke-width': '3.6', 'stroke-linecap': 'round', d: 'M26 90C20 104 22 118 32 129' });
  const inner = svgEl('path', { class: 'fi', fill: `url(#${id}i)`, d: 'M66 50C70 65 85 77 88 98C91 121 77 137 60 137C45 137 33 127 32 112C31 101 36 93 43 87C45 94 48 99 53 102C52 83 57 66 66 50Z' });
  const core = svgEl('path', { class: 'fc', fill: `url(#${id}c)`, d: 'M63 96C65 104 72 111 71 121C70 129 64 133 59 131C54 129 53 122 55 115C56 108 60 103 63 96Z' });
  g.append(outer, vol, shine, inner, core);
  s.append(defs, g);
  if (big && !off) {

    [[44, 30, 2.2, 0], [80, 22, 1.8, .9], [62, 2, 1.5, 1.7]].forEach(([x, y, r, d]) => em.append(svgEl('circle', { cx: x, cy: y, r, fill: '#ffc94d', style: `animation-delay:${d}s` })));

/* ---------- profile screen ---------- */
let profileRange = 7;
function openProfile() {
  $('#lib').hidden = true; $('#profile').hidden = false; $('#tabbar').hidden = true; $('#btn-add').hidden = true;
  window.scrollTo(0, 0); renderProfile(); playIn($('#profile .wrap'), 'push-in'); libScrollChrome();
}
function closeProfile() {
  $('#profile').hidden = true; $('#lib').hidden = false; $('#tabbar').hidden = false; $('#btn-add').hidden = false;
  renderLibrary(false); playIn($('#lib .wrap'), 'pop-back'); paintTabbar(); libScrollChrome();
}

function renderProfile() {
  const main = $('#pf-main');
  main.replaceChildren();
  const st = streakInfo();
  const tot = totals();
  const today = ST.data.days[dayKey()] || { ms: 0, chars: 0 };
  const goal = goalMs();
  const speed = wpm(tot.chars, tot.ms);
  const state = st.todayMet ? 'on' : st.current > 0 ? 'risk' : 'off';
  const left = Math.max(0, Math.ceil((goal - today.ms) / 60000));

  /* hero: the flame carries the streak number; the bar under it is today's goal */
  const flame = flameSvg(state === 'off' ? 'off' : 'on', 0);
  // the flame only comes alive when the streak has grown since the last visit
  const celebrate = st.current > 0 && st.current > (ST.data.seenStreak || 0) && !reduceMotion();
  if (ST.data.seenStreak !== st.current) { ST.data.seenStreak = st.current; saveStats(); }
  if (celebrate) flame.classList.add('celebrate');
  const num = flame.querySelector('.fnum');
  const status = st.todayMet ? `Цель на сегодня выполнена — ${fmtDur(today.ms)}. Огонёк горит!`
    : st.current > 0 ? `Почитайте ещё ${left} мин сегодня, чтобы не потерять серию`
      : `Огонёк загорится после ${ST.data.goal} минут чтения за день`;
  const fill = h('i', { style: `width:${Math.min(100, (today.ms / goal) * 100)}%` });
  const week = h('div', { class: 'week', role: 'list', 'aria-label': 'Последние 7 дней' });
  const wd = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dayKey(d), rec = ST.data.days[k], met = dayMet(k), part = rec && rec.ms > 0 && !met;
    week.append(h('div', { class: 'wd' + (i === 0 ? ' today' : ''), role: 'listitem', style: `--i:${6 - i}`, 'aria-label': `${wd[d.getDay()]}: ${rec ? fmtDur(rec.ms) : 'не читали'}` },
      h('span', { class: 'dot' + (met ? ' met' : part ? ' part' : '') }, met ? flameSvg('on') : null),
      h('span', { class: 'wl' }, wd[d.getDay()])));
  }
  main.append(h('section', { class: 'p-hero card ' + state },
    h('div', { class: 'hero-top' },
      h('div', { class: 'flame-box', role: 'img', 'aria-label': `Серия: ${st.current} ${plural(st.current, ['день', 'дня', 'дней'])} подряд` }, flame),
      h('div', { class: 'hero-txt' },
        h('div', { class: 'streak-title' }, `${plural(st.current, ['день', 'дня', 'дней'])} подряд`),
        h('p', { class: 'hero-status' }, status),
        h('div', { class: 'goal-bar' }, h('div', { class: 'gb-row' }, h('span', null, 'Сегодня'), h('span', null, `${Math.min(ST.data.goal, Math.floor(today.ms / 60000))} из ${ST.data.goal} мин`)), h('div', { class: 'gb' }, fill)))),
    week));
  if (celebrate) { countUp(num, st.current, (v) => String(Math.round(v)), 900); setTimeout(() => num.classList.add('pop'), 920); }
  else num.textContent = String(st.current);

  /* tiles */
  const tiles = [
    ['Всего за всё время', tot.ms, (v) => fmtDur(v, true), tot.first ? `с ${fmtDate(tot.first).replace(/ \d{4} г\.?$/, '')}` : 'Пока ни минуты'],
    ['Сегодня', today.ms, (v) => fmtDur(v, true), `цель — ${ST.data.goal} мин`],
    ['Скорость', speed, (v) => (speed ? Math.round(v) + '' : '—'), speed ? 'слов в минуту' : 'посчитаем после пары минут чтения'],
    ['Прочитано', tot.chars / CHARS_PER_PAGE, (v) => Math.round(v) + '', plural(Math.round(tot.chars / CHARS_PER_PAGE), ['страница', 'страницы', 'страниц'])],
  ];
  const grid = h('section', { class: 'tiles' });
  tiles.forEach(([label, val, fmt, sub], i) => {
    const n = h('b', null, fmt(0));
    grid.append(h('div', { class: 'stile card', style: `--i:${i}` }, h('span', { class: 'tl' }, label), n, h('span', { class: 'ts' }, sub)));
    countUp(n, val, fmt, 1000);
  });
  main.append(grid);

  /* activity chart */
  main.append(activityCard());

  /* books */
  const rows = Object.entries(ST.data.books).filter(([, b]) => b.ms >= 30000).sort((a, b) => b[1].ms - a[1].ms);
  const maxMs = rows.length ? rows[0][1].ms : 1;
  const list = h('div', { class: 'blist' });
  if (!rows.length) list.append(h('p', { class: 'muted', style: 'padding:18px 6px' }, 'Здесь появятся книги, которые вы читали, и сколько времени ушло на каждую.'));
  rows.forEach(([id, s], i) => {
    const book = state_book(id);
    const sp = wpm(s.chars, s.ms);
    const pct = book ? pctOf(book) : 0;
    const remainChars = book && s.total ? Math.max(0, s.total * (1 - ((book.progress && book.progress.pct) || 0))) : 0;
    const eta = sp && remainChars && pct < 100 ? `осталось ≈ ${fmtDur(remainChars / CHARS_PER_WORD / sp * 60000)}` : pct >= 100 ? 'прочитана' : '';
    const bar = h('i', { style: `width:${Math.max(4, (s.ms / maxMs) * 100)}%` });
    const row = h(book ? 'button' : 'div', { class: 'brow', style: `--i:${i}`, onclick: book ? () => openDetail(book) : null },
      book ? coverEl(book) : h('span', { class: 'cover' }),
      h('span', { class: 'bm' },
        h('span', { class: 'bt' }, book ? book.title : s.title || 'Удалённая книга'),
        h('span', { class: 'bs' }, [fmtDur(s.ms), sp ? `${sp} сл/мин` : '', eta].filter(Boolean).join(' · ')),
        h('span', { class: 'share' }, bar)),
      h('span', { class: 'bpct' }, book ? pct + '%' : ''));
    list.append(row);
  });
  main.append(h('section', { class: 'card pad' }, h('div', { class: 'card-h' }, h('h2', null, 'Время по книгам'), rows.length ? h('span', null, `${rows.length} ${plural(rows.length, BOOKS)}`) : null), list));

  /* records */
  main.append(h('section', { class: 'records' },
    rec('Лучшая серия', `${st.best} ${plural(st.best, ['день', 'дня', 'дней'])}`),
    rec('Рекорд за день', tot.bestDay ? fmtDur(tot.bestDay, true) : '—'),
    rec('Дочитано книг', String(booksDone()))));

  /* goal */
  const goals = [5, 10, 15, 30, 60];
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Цель на день' }, goals.map((g) =>
    h('button', { 'aria-pressed': String(ST.data.goal === g), onclick: () => { ST.data.goal = g; saveStats(); renderProfile(); } }, g + ' мин')));
  main.append(h('section', { class: 'card pad' }, h('div', { class: 'card-h' }, h('h2', null, 'Цель на день')),
    h('p', { class: 'hint-p' }, 'Сколько минут нужно читать в день, чтобы огонёк горел и серия росла.'), seg));
}
function rec(label, value) { return h('div', { class: 'rec card' }, h('b', null, value), h('span', null, label)); }
function booksDone() { return state.books.filter((b) => pctOf(b) >= 100).length; }
function state_book(id) { return state.books.find((b) => b.id === id) || null; }

function activityCard() {
  const days = profileRange;
  const goal = goalMs();
  const items = [];
  for (let i = days - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const k = dayKey(d); items.push({ d, k, ms: (ST.data.days[k] || {}).ms || 0 }); }
  const sum = items.reduce((a, x) => a + x.ms, 0);
  const max = Math.max(goal * 1.25, ...items.map((x) => x.ms));
  const wd = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  const fmtD = (d) => `${wd[d.getDay()]}, ${d.getDate()} ${['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'][d.getMonth()]}`;
  const tip = h('div', { class: 'ctip', hidden: true });
  const plot = h('div', { class: 'plot', style: `--n:${days}` });
  const goalY = (goal / max) * 100;
  plot.append(h('div', { class: 'goal-line', style: `bottom:${goalY}%` }, h('span', null, `цель ${ST.data.goal} мин`)));
  items.forEach((x, i) => {
    const col = h('button', { class: 'col' + (x.ms >= goal ? ' met' : '') + (i === days - 1 ? ' today' : ''), style: `--i:${i}`, 'aria-label': `${fmtD(x.d)}: ${x.ms ? fmtDur(x.ms) : 'не читали'}` },
      h('span', { class: 'barv' + (x.ms ? '' : ' zero'), style: `height:${x.ms ? Math.max(2.5, (x.ms / max) * 100) : 0}%` }));
    const show = () => {
      $$('.col.sel', plot).forEach((c) => c.classList.remove('sel'));
      col.classList.add('sel');
      tip.hidden = false;
      tip.replaceChildren(h('b', null, x.ms ? fmtDur(x.ms) : 'Не читали'), h('span', null, fmtD(x.d)));
      const pr = plot.getBoundingClientRect(), cr = col.getBoundingClientRect();
      tip.style.left = clamp(cr.left - pr.left + cr.width / 2, 50, pr.width - 50) + 'px';
    };
    col.addEventListener('pointerenter', show); col.addEventListener('focus', show); col.addEventListener('click', show);
    plot.append(col);
  });
  plot.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { tip.hidden = true; $$('.col.sel', plot).forEach((c) => c.classList.remove('sel')); } });
  const axis = h('div', { class: 'xaxis', style: `--n:${days}` }, items.map((x, i) => h('span', null, days === 7 ? wd[x.d.getDay()] : (i % 5 === 4 || i === days - 1 ? String(x.d.getDate()) : ''))));
  const seg = h('div', { class: 'seg mini', role: 'group', 'aria-label': 'Период' }, [[7, '7 дней'], [30, '30 дней']].map(([n, l]) =>
    h('button', { 'aria-pressed': String(days === n), onclick: () => { profileRange = n; const c = activityCard(); $('#activity').replaceWith(c); } }, l)));
  const empty = !sum ? h('p', { class: 'chart-empty' }, 'График заполнится, когда вы начнёте читать') : null;
  return h('section', { class: 'card pad', id: 'activity' },
    h('div', { class: 'card-h' }, h('h2', null, 'Активность'), seg),
    h('p', { class: 'sum' }, h('b', null, fmtDur(sum, true)), ` за ${days === 7 ? 'неделю' : '30 дней'} · в среднем ${fmtDur(sum / days, true)} в день`),
    h('div', { class: 'chart' }, plot, tip, empty), axis);
}

async function seedSamples() {
  for (const s of SAMPLES) {
    if (state.books.some((b) => b.title === s.title && b.sample)) continue;
    const xml = sampleFb2(s);
    const res = parseFb2Text(xml);
    const now = Date.now() - (s.shelf === 'Проза' ? 1000 : 0);
    Object.assign(res.book, { id: uid(), fileName: s.id + '.fb2', size: new Blob([xml]).size, addedAt: now, openedAt: 0, progress: null, bookmarks: [], shelf: s.shelf, modifiedAt: 0, edits: 0, coverChanged: false, sample: true });
    res.content.id = res.book.id;
    try { await DB.put('content', res.content); await DB.put('books', res.book); state.books.push(res.book); } catch (e) { /* storage unavailable */ }
  }
  prefs.seeded = true; savePrefs();
}

/* books shared into the app (Android share sheet) or opened with it (desktop) */
async function takeSharedFiles() {
  if (!/[?&]shared=1/.test(location.search) || !('caches' in window)) return;
  try {
    const c = await caches.open('polka-inbox');
    const files = [];
    for (const req of await c.keys()) {
      const res = await c.match(req);
      if (res) files.push(new File([await res.blob()], decodeURIComponent(res.headers.get('x-name') || 'book.fb2')));
      await c.delete(req);
    }
    history.replaceState(null, '', location.pathname);
    if (files.length) importFiles(files);
  } catch (e) { toast('Не удалось принять файл: ' + e.message, { tone: 'error' }); }
}

    const files = await Promise.all(params.files.map((f) => f.getFile()));
    importFiles(files);
  });
}

/* ================= motion helpers ================= */
function withVT(fn) {
  if (document.startViewTransition && !reduceMotion()) { try { document.startViewTransition(fn); return; } catch (e) { /* fall through */ } }
  fn();
}
// the book cover flies from where it was tapped into the opening book
function flyCover(src) {
  if (!src || reduceMotion()) return;
  const r = src.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const c = src.cloneNode(true);
  c.classList.add('fly');
  Object.assign(c.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', margin: '0', zIndex: '200', transformOrigin: 'center', pointerEvents: 'none' });
  document.body.append(c);
  const s = Math.min((window.innerHeight * 0.6) / r.height, (window.innerWidth * 0.7) / r.width);
  const tx = window.innerWidth / 2 - (r.left + r.width / 2), ty = window.innerHeight / 2 - (r.top + r.height / 2);
  const a = c.animate([
    { transform: 'translate(0,0) scale(1) rotateY(0)', opacity: 1 },
    { transform: `translate(${tx}px,${ty}px) scale(${s})`, opacity: 1, offset: 0.62 },
    { transform: `translate(${tx}px,${ty}px) scale(${s * 1.06})`, opacity: 0 },
  ], { duration: 680, easing: 'cubic-bezier(.32,.72,0,1)' });
  a.onfinish = a.oncancel = () => c.remove();
}
// sliding selection pill for every segmented control, remembered per control
const SEGMEM = new Map();
function enhanceSeg(seg) {
  const btns = [...seg.children].filter((b) => b.tagName === 'BUTTON');
  if (!btns.length) return;
  const idx = btns.findIndex((b) => b.getAttribute('aria-pressed') === 'true' || b.getAttribute('aria-selected') === 'true');
  const key = btns.map((b) => b.textContent.trim()).join('|');
  const prev = SEGMEM.has(key) ? SEGMEM.get(key) : idx;
  seg.classList.add('pill');
  seg.style.setProperty('--n', btns.length);
  seg.style.setProperty('--idx', Math.max(0, prev));
  seg.classList.toggle('none', idx < 0);
  SEGMEM.set(key, idx);
  if (prev !== idx && idx >= 0) requestAnimationFrame(() => requestAnimationFrame(() => seg.style.setProperty('--idx', idx)));
}
new MutationObserver((list) => {
  for (const m of list) for (const n of m.addedNodes) {
    if (n.nodeType !== 1) continue;
    if (n.classList.contains('seg')) enhanceSeg(n);
    else if (n.parentElement && n.parentElement.classList.contains('seg')) enhanceSeg(n.parentElement);
    else n.querySelectorAll && n.querySelectorAll('.seg').forEach(enhanceSeg);
  }
}).observe(document.body, { childList: true, subtree: true });

  libScrollChrome();
  takeSharedFiles();
})();
