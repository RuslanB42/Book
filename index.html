/* Layout: one calm column. Library = large title, chips, glass pockets (shelves) and planks; reader = a single 34em text column with floating chrome. */
:root, .tone-dark {
  --bg: #161617;
  --bg-raised: #1f1f21;
  --bg-raised-2: #2a2a2d;
  --fg: #f3f2ef;
  --fg-2: rgba(243, 242, 239, .64);
  --fg-3: rgba(243, 242, 239, .42);
  --hair: rgba(255, 255, 255, .09);
  --fill: rgba(255, 255, 255, .07);
  --fill-2: rgba(255, 255, 255, .12);
  --pill: #f3f2ef;
  --pill-fg: #161617;
  --accent: #f0a742;
  --accent-ink: #f3b35a;
  --danger: #ff6b61;
  --glass: rgba(255, 255, 255, .055);
  --glass-brd: rgba(255, 255, 255, .13);
  --glass-hl: rgba(255, 255, 255, .2);
  --glass-shadow: 0 18px 40px rgba(0, 0, 0, .45);
  --plank-top: #3b3b3e;
  --plank-front: #2a2a2d;
  --plank-shadow: rgba(0, 0, 0, .55);
  --cover-shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 10px 20px rgba(0, 0, 0, .38);
  --bar: rgba(22, 22, 23, .74);
  --scrim: rgba(0, 0, 0, .5);
  --sheet: #1c1c1e;
  --seg-on: #4a4a4e;
  color-scheme: dark;
}
:root {
  --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-display: "Literata", "PT Serif", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(.32, .72, 0, 1);
  --r-bg: #18181a;
  --r-fg: #dedcd6;
  --r-size: 19px;
  --r-lh: 1.6;
  --r-font: "Literata", Georgia, serif;
}
.tone-light, :root[data-ui="light"], :root[data-ui="system"][data-theme="light"] {
  --frost-b: 1.05;
  --bg: #f2f2f0;
  --bg-raised: #ffffff;
  --bg-raised-2: #e9e9e6;
  --fg: #1a1a1c;
  --fg-2: rgba(26, 26, 28, .64);
  --fg-3: rgba(26, 26, 28, .44);
  --hair: rgba(0, 0, 0, .09);
  --fill: rgba(0, 0, 0, .05);
  --fill-2: rgba(0, 0, 0, .09);
  --pill: #1a1a1c;
  --pill-fg: #ffffff;
  --accent: #d48a1a;
  --accent-ink: #9a5800;
  --danger: #d70015;
  --glass: rgba(255, 255, 255, .4);
  --glass-brd: rgba(255, 255, 255, .8);
  --glass-hl: rgba(255, 255, 255, .95);
  --glass-shadow: 0 14px 30px rgba(0, 0, 0, .12);
  --plank-top: #ffffff;
  --plank-front: #e6e6e3;
  --plank-shadow: rgba(0, 0, 0, .13);
  --cover-shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 8px 16px rgba(0, 0, 0, .16);
  --bar: rgba(242, 242, 240, .8);
  --scrim: rgba(0, 0, 0, .28);
  --sheet: #f7f7f5;
  --seg-on: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root[data-ui="system"]:not([data-theme="dark"]) {
    --frost-b: 1.05;
    --bg: #f2f2f0; --bg-raised: #ffffff; --bg-raised-2: #e9e9e6; --fg: #1a1a1c;
    --fg-2: rgba(26, 26, 28, .64); --fg-3: rgba(26, 26, 28, .44); --hair: rgba(0, 0, 0, .09);
    --fill: rgba(0, 0, 0, .05); --fill-2: rgba(0, 0, 0, .09); --pill: #1a1a1c; --pill-fg: #ffffff;
    --accent: #d48a1a; --accent-ink: #9a5800; --danger: #d70015;
    --glass: rgba(255, 255, 255, .4); --glass-brd: rgba(255, 255, 255, .8); --glass-hl: rgba(255, 255, 255, .95);
    --glass-shadow: 0 14px 30px rgba(0, 0, 0, .12); --plank-top: #ffffff; --plank-front: #e6e6e3;
    --plank-shadow: rgba(0, 0, 0, .13); --cover-shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 8px 16px rgba(0, 0, 0, .16);
    --bar: rgba(242, 242, 240, .8); --scrim: rgba(0, 0, 0, .28); --sheet: #f7f7f5; --seg-on: #ffffff;
    color-scheme: light;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html.locked, html.locked body { overflow: hidden; }
body {
  margin: 0;
  background: var(--page, var(--bg));
  color: var(--fg);
  font: 16px/1.4 var(--f-ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--page, var(--bg));
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 18px; height: 18px; }
.ic.fillable.on { fill: currentColor; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Library ---------- */
.lib { min-height: 100%; padding-bottom: 72px; }
.navbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  height: 52px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
  background: transparent;
  transition: background .25s, box-shadow .25s;
}
.navbar.solid {
  background: var(--bar);
  -webkit-backdrop-filter: saturate(1.6) blur(20px); backdrop-filter: saturate(1.6) blur(20px);
  box-shadow: 0 .5px 0 var(--hair);
}
.navbar .mini { font-weight: 600; font-size: 17px; opacity: 0; transition: opacity .2s; white-space: nowrap; }
.navbar.solid .mini { opacity: 1; }
.navbar .end { justify-self: end; display: flex; gap: 2px; }
.icon-btn {
  width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px;
  color: var(--fg); transition: background .15s;
}
.icon-btn:hover { background: var(--fill); }
.icon-btn:active { background: var(--fill-2); }

.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.large-title {
  font-family: var(--f-display); font-weight: 600; font-size: 36px; line-height: 1.1;
  letter-spacing: -.015em; margin: 2px 0 14px;
}
.search {
  position: relative; display: flex; align-items: center; margin-bottom: 14px;
}
.search .ic { position: absolute; left: 10px; color: var(--fg-3); pointer-events: none; }
.search input {
  width: 100%; height: 38px; border: 0; border-radius: 11px; background: var(--fill);
  padding: 0 36px 0 38px; font-size: 16px; outline: none;
}
.search input::placeholder { color: var(--fg-3); }
.search input:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
.search .clear { position: absolute; right: 2px; width: 36px; height: 36px; display: grid; place-items: center; color: var(--fg-3); }
.search input::-webkit-search-cancel-button { display: none; }

.chips { margin: 0 0 24px; }
.seg.tabs { max-width: 420px; }
.seg.tabs button { min-height: 34px; font-size: 15px; transition: background .25s var(--ease), box-shadow .25s; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 36px; padding: 0 16px; border-radius: 18px; font-size: 15px;
  color: var(--fg-2); transition: background .2s, color .2s;
}
.chip:hover { color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--pill); color: var(--pill-fg); font-weight: 500; }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
.sec-head h2 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.sec-head span { color: var(--fg-3); font-size: 14px; font-variant-numeric: tabular-nums; }

/* continue card */
.cont {
  display: grid; grid-template-columns: 76px 1fr; gap: 16px; align-items: center;
  padding: 14px; border-radius: 20px; background: var(--bg-raised); margin-bottom: 34px;
  text-align: left; width: 100%;
}
.cont .meta { min-width: 0; display: grid; gap: 4px; }
.cont .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
.cont .t { font-family: var(--f-display); font-weight: 600; font-size: 18px; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cont .a { color: var(--fg-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cont .prog { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 13px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 3px; border-radius: 2px; background: var(--fill-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--fg); border-radius: 2px; }
.cont:hover { background: var(--bg-raised-2); }

/* covers */
.cover {
  position: relative; display: block; width: 100%; aspect-ratio: 2 / 3; border-radius: 2px 4px 4px 2px;
  overflow: hidden; background: var(--bg-raised-2); box-shadow: var(--cover-shadow); container-type: inline-size;
}
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,.28) 0, rgba(255,255,255,.18) 2.5%, rgba(255,255,255,0) 6%, rgba(0,0,0,.06) 8%, rgba(0,0,0,0) 12%),
              linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.06));
}
.gcover {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: 11cqw 10cqw 10cqw 12cqw; text-align: left;
}
.gcover .ga { margin-top: auto; font: 600 6.4cqw/1.25 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; opacity: .78; }
.gcover .gr { width: 22cqw; height: 1px; background: currentColor; opacity: .5; margin: 6cqw 0; }
.gcover .gt { font: 600 11.5cqw/1.12 var(--f-display); letter-spacing: -.01em; overflow-wrap: anywhere; hyphens: auto;
  display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }

/* pockets (shelves) */
.pockets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 18px; }
@media (min-width: 680px) { .pockets { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px 28px; } }
@media (min-width: 980px) { .pockets { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.pocket { display: grid; gap: 12px; text-align: center; }
.pocket .well { position: relative; aspect-ratio: 1 / .94; container-type: inline-size; }
/* every pocket is identical: same cover size, same baseline, no tilt — only the horizontal fan changes with the count */
.pocket .c {
  position: absolute; width: 46%; bottom: 10%; left: 27%;
  transition: transform .45s var(--ease);
}
.pocket .c:nth-child(1) { z-index: 3; }
.pocket .c:nth-child(2) { z-index: 2; }
.pocket .c:nth-child(3) { z-index: 1; }
.pocket [data-n="2"] > .c:nth-child(1) { left: 19%; }
.pocket [data-n="2"] > .c:nth-child(2) { left: 35%; }
.pocket [data-n="3"] > .c:nth-child(1) { left: 11%; }
.pocket [data-n="3"] > .c:nth-child(2) { left: 27%; }
.pocket [data-n="3"] > .c:nth-child(3) { left: 43%; }
@media (hover: hover) { .pocket:hover .c { transform: translateY(-6%); } }
.pocket .glass {
  position: absolute; left: 0; right: 0; bottom: 0; height: 54%; z-index: 5; border-radius: 4.5cqw; overflow: hidden;
  background: var(--bg);
  border: 1px solid var(--glass-brd);
  box-shadow: inset 0 1px 0 var(--glass-hl), var(--glass-shadow);
  transform: translateZ(0);
}
/* frosted copy of the covers: a plain filter, so the blur survives tab switches and animations */
.pocket .frost {
  position: absolute; left: -1px; right: -1px; bottom: -1px; height: calc(100% / .54 + 2px);
  filter: blur(11px) saturate(1.5) brightness(var(--frost-b, .82)); pointer-events: none;
  will-change: transform; contain: paint;
}
.pocket .frost .c { box-shadow: none; }
.pocket .tint { position: absolute; inset: 0; background: var(--glass); box-shadow: inset 0 0 0 999px var(--glass-tint, transparent); }
.pocket .glass i { z-index: 2; }
.pocket.add .glass b { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; color: var(--fg-2); }
.pocket.add .glass b .ic { width: 30px; height: 30px; stroke-width: 1.6; }
.pocket.add .well::before { display: none; }
.pocket.add .lbl { color: var(--fg-2); }
.pocket .glass i {
  position: absolute; width: 4.4cqw; height: 4.4cqw; min-width: 7px; min-height: 7px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff 0, #c9c9c9 35%, #7d7d7d 75%, #5a5a5a 100%);
  box-shadow: 0 1px 1px rgba(0,0,0,.35);
}
.pocket .glass i:nth-of-type(1) { left: 4.5cqw; top: 4.5cqw; }
.pocket .glass i:nth-of-type(2) { right: 4.5cqw; top: 4.5cqw; }
.pocket .glass i:nth-of-type(3) { left: 4.5cqw; bottom: 4.5cqw; }
.pocket .glass i:nth-of-type(4) { right: 4.5cqw; bottom: 4.5cqw; }
.pocket .lbl { font-size: 15px; font-weight: 500; }
.pocket .lbl span { color: var(--fg-3); font-weight: 400; }
.pocket .lbl span::before { content: "·"; margin: 0 7px; }

/* shelf with planks */
.shelf { display: grid; gap: 34px; --cols: 3; }
.row .books {
  display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: clamp(14px, 3vw, 30px);
  align-items: end; padding: 0 clamp(10px, 2.4vw, 26px);
}
.plank {
  position: relative; height: 16px; margin-top: -2px; border-radius: 3px;
  background: linear-gradient(180deg, var(--plank-top) 0 55%, var(--plank-front) 55% 100%);
  box-shadow: 0 16px 22px -10px var(--plank-shadow), 0 1px 2px var(--plank-shadow), inset 0 1px 0 var(--glass-hl);
}
.book { position: relative; display: block; text-align: left; transition: transform .3s var(--ease); }
@media (hover: hover) { .book:hover { transform: translateY(-4px); } }
.book .badge {
  position: absolute; right: 6%; bottom: 5%; z-index: 2; font: 600 11px/1 var(--f-ui); font-variant-numeric: tabular-nums;
  padding: 4px 6px; border-radius: 6px; background: rgba(20,20,22,.72); color: #f3f2ef;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.book .cap { display: block; margin-top: 8px; font-size: 13px; line-height: 1.25; color: var(--fg-2);
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row.captions .plank { margin-top: 0; }
.row.captions .books { align-items: start; }

/* empty states */
.empty { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 40px 0 20px; }
.empty .art { width: 180px; margin-bottom: 10px; }
.empty h2 { font-family: var(--f-display); font-size: 24px; font-weight: 600; margin: 0; text-wrap: balance; }
.empty p { margin: 0; max-width: 34ch; color: var(--fg-2); text-wrap: pretty; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px;
  border-radius: 24px; font-size: 16px; font-weight: 600; background: var(--pill); color: var(--pill-fg);
  transition: transform .15s, opacity .15s;
}
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--fill); color: var(--fg); }
.btn.wide { width: 100%; }
.btn.danger { background: var(--danger); color: #fff; }
.link-btn { color: var(--accent-ink); font-weight: 500; padding: 10px 4px; }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--fill); color: var(--fg-2); font-size: 14px; margin-bottom: 18px; }

/* drop overlay */
.drop {
  position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: var(--scrim);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.drop div { padding: 34px 40px; border-radius: 26px; border: 2px dashed var(--fg-3); background: var(--sheet); text-align: center; font-weight: 600; font-size: 18px; max-width: calc(100% - 40px); }
.drop div small { display: block; font-weight: 400; color: var(--fg-2); font-size: 14px; margin-top: 6px; }

/* ---------- Sheets ---------- */
.scrim { position: fixed; inset: 0; z-index: 70; background: var(--scrim); opacity: 0; transition: opacity .3s; }
.scrim.in { opacity: 1; }
.sheet {
  position: fixed; z-index: 71; left: 0; right: 0; bottom: 0; max-height: calc(100% - 48px - env(safe-area-inset-top, 0px));
  display: flex; flex-direction: column; background: var(--sheet); color: var(--fg);
  border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.3);
  transform: translateY(100%); transition: transform .42s var(--ease);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.tall { height: calc(100% - 48px - env(safe-area-inset-top, 0px)); }
.sheet.in { transform: translateY(0); }
.sheet.drag { transition: none; }
@media (min-width: 720px) {
  .sheet {
    left: 50%; right: auto; bottom: auto; top: 50%; width: min(540px, calc(100% - 48px)); max-height: min(780px, calc(100% - 64px));
    border-radius: 22px; transform: translate(-50%, -46%) scale(.97); opacity: 0;
    transition: transform .32s var(--ease), opacity .2s;
  }
  .sheet.tall { height: min(780px, calc(100% - 64px)); }
  .sheet.in { transform: translate(-50%, -50%); opacity: 1; }
  .sheet .grab { display: none; }
}
.grab { height: 18px; display: grid; place-items: center; flex: none; touch-action: none; cursor: grab; }
.grab::before { content: ""; width: 38px; height: 5px; border-radius: 3px; background: var(--fill-2); }
.sheet-head {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; flex: none; touch-action: none;
}
.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-head .l { justify-self: start; } .sheet-head .r { justify-self: end; }
.sheet-head .txt-btn { min-height: 44px; padding: 0 8px; font-size: 17px; color: var(--accent-ink); white-space: nowrap; }
.sheet-head .txt-btn.strong { font-weight: 600; }
.sheet-head .close { width: 32px; height: 32px; border-radius: 16px; background: var(--fill); display: grid; place-items: center; color: var(--fg-2); }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px 24px; flex: 1; min-height: 0; }

/* grouped lists (iOS inset grouped) */
.group { background: var(--bg-raised); border-radius: 14px; overflow: hidden; margin: 0 0 22px; }
.group-title { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg-3); margin: 0 0 7px 16px; font-weight: 500; }
.cell { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 46px; padding: 11px 16px; font-size: 16px; }
.cell + .cell { box-shadow: inset 16px .5px 0 var(--bg-raised), inset 0 .5px 0 var(--hair); }
.cell .k { color: var(--fg); flex: none; }
.cell .v { color: var(--fg-2); text-align: right; min-width: 0; overflow-wrap: anywhere; }
.cell.btn-cell { width: 100%; text-align: left; }
.cell.btn-cell:hover { background: var(--fill); }

/* book detail */
.detail { display: grid; justify-items: center; text-align: center; gap: 6px; padding-top: 6px; }
.detail .cv { width: 148px; margin-bottom: 14px; }
.detail h3 { font-family: var(--f-display); font-size: 24px; line-height: 1.2; font-weight: 600; margin: 0; text-wrap: balance; }
.detail .au { color: var(--fg-2); font-size: 16px; }

.pick button { width: 100%; display: grid; grid-template-columns: 38px 1fr 26px; gap: 14px; align-items: center; padding: 10px 2px; text-align: left; }
.pick .t { font-size: 16px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pick .s { font-size: 13px; color: var(--fg-3); }
.pick .ck { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--fg-3); display: grid; place-items: center; color: transparent; transition: background .2s, color .2s, box-shadow .2s; }
.pick .ck .ic { width: 16px; height: 16px; }
.pick [aria-pressed="true"] .ck, .pick [aria-checked="true"] .ck { background: var(--accent); box-shadow: none; color: #fff; }
.menu-list { display: grid; }
.menu-list button { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 16px; font-size: 16px; text-align: left; }
.menu-list button + button { box-shadow: inset 52px .5px 0 var(--bg-raised), inset 0 .5px 0 var(--hair); }
.menu-list button:hover { background: var(--fill); }
.menu-list .danger { color: var(--danger); }
.cell .v.link { color: var(--accent-ink); }

/* motion */
@keyframes screen-in { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes ch-in { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes ch-in-back { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.3); } 100% { transform: scale(1); } }
@keyframes pop-in { from { opacity: 0; transform: translateY(6px) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes bar-in { from { opacity: 0; transform: translate(-50%, 24px); } to { opacity: 1; transform: translate(-50%, 0); } }
#reader.screen-in { animation: fade .35s ease both; }
#reader.screen-in .r-content { animation: screen-in .5s var(--ease) both; }
.wrap.screen-in { animation: screen-in .45s var(--ease) both; }
.fade-in { animation: fade .25s ease both; }
.rise > :not(.home), .rise .shelf > .row { animation: rise .55s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 55ms); }
.ch-in { animation: ch-in .45s var(--ease) both; }
.ch-in-back { animation: ch-in-back .45s var(--ease) both; }
.pop { animation: pop .4s var(--ease); transform-origin: center; }
.pop-in { animation: pop-in .22s var(--ease) both; }
.bar-in { animation: bar-in .35s var(--ease) both; }
.pocket, .book, .tile, .btn, .chip, .cont { -webkit-user-select: none; user-select: none; }
.pocket { transition: transform .25s var(--ease); }
.pocket:active { transform: scale(.97); }
.book:active { transform: scale(.96); }
.tile { transition: transform .2s var(--ease), background .2s; }
.tile:active { transform: scale(.96); }
.icon-btn:active { transform: scale(.92); }
.icon-btn { transition: background .15s, transform .15s var(--ease); }
.cont { transition: background .2s, transform .25s var(--ease); }
.cont:active { transform: scale(.985); }

@media (prefers-reduced-motion: reduce) {
  :root[data-motion="system"] *, :root[data-motion="system"] *::before, :root[data-motion="system"] *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-delay: 0s !important; }
}

/* book grid ("Всё" and an opened shelf) */
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 28px 16px; }
@media (min-width: 680px) { .bgrid { grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 34px 24px; } }
.bcell { display: grid; gap: 3px; text-align: left; align-content: start; min-width: 0; transition: transform .25s var(--ease); -webkit-user-select: none; user-select: none; }
.bcell:active { transform: scale(.96); }
.bcell .bc { position: relative; display: block; margin-bottom: 8px; transition: transform .3s var(--ease); }
@media (hover: hover) { .bcell:hover .bc { transform: translateY(-4px); } }
.bcell .badge { position: absolute; right: 6%; bottom: 5%; z-index: 2; font: 600 11px/1 var(--f-ui); padding: 4px 6px; border-radius: 6px; background: rgba(20,20,22,.72); color: #f3f2ef; }
.bcell .bt { font-size: 14px; font-weight: 500; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.bcell .ba { font-size: 12.5px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bcell .bp { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-3); margin-top: 3px; font-variant-numeric: tabular-nums; }
.bcell .bp .bar { flex: 1; }
.rise .bgrid > .bcell { animation: rise .5s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 35ms); }
.sort-btn { display: inline-flex; align-items: center; gap: 2px; font-size: 15px; color: var(--accent-ink); min-height: 36px; }
.ic.xs { width: 14px; height: 14px; transform: rotate(90deg); }
.back-link { display: inline-flex; align-items: center; gap: 2px; font-size: 17px; color: var(--accent-ink); min-height: 40px; margin-left: -6px; }

.lib-fade { animation: fade .2s ease both; }

/* ---------- profile ---------- */
.pf-btn { position: relative; justify-self: start; }
.pf-badge { position: absolute; top: 5px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: linear-gradient(180deg, #ffb43b, #e8562a); color: #fff; font: 700 11px/18px var(--f-ui); text-align: center; box-shadow: 0 0 0 2px var(--bg); font-variant-numeric: tabular-nums; }
.pf-badge.dim { background: var(--fill-2); color: var(--fg-2); }
.back-btn { display: inline-flex; align-items: center; gap: 2px; height: 44px; padding: 0 10px 0 2px; font-size: 17px; color: var(--accent-ink); justify-self: start; border-radius: 22px; }
.profile .wrap { padding-bottom: 40px; }
.profile #pf-main { display: grid; gap: 14px; }
.card { background: var(--bg-raised); border-radius: 22px; }
.card.pad { padding: 18px 18px 16px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.card-h h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.card-h > span { color: var(--fg-3); font-size: 14px; }
.hint-p { margin: -4px 0 14px; color: var(--fg-2); font-size: 14px; line-height: 1.4; }

.p-hero { padding: 20px 18px 16px; position: relative; overflow: hidden; }
.p-hero::before { content: ""; position: absolute; inset: -40% -20% auto auto; width: 70%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(242,138,46,.22), transparent 65%); pointer-events: none; opacity: 0; transition: opacity .8s; }
.p-hero.on::before { opacity: 1; }
.p-hero.risk::before { opacity: .45; }
.hero-top { display: grid; grid-template-columns: 124px 1fr; gap: 16px; align-items: center; position: relative; }
.flame-box { width: 124px; display: grid; place-items: center; padding: 4px 0; }
.flame { overflow: visible; display: block; }
.flame-box .flame { width: 116px; height: auto; }
.flame .fbody, .flame .fo, .flame .fi, .flame .fc, .flame .fv { transform-box: fill-box; }
.flame.big.on { filter: drop-shadow(0 8px 24px rgba(255,110,25,.48)); }
.flame.big.celebrate .fbody { transform-origin: 50% 100%; animation: sway 1.6s ease-in-out 2; }
.flame.big.celebrate .fo, .flame.big.celebrate .fv, .flame.big.celebrate .fs { transform-origin: 50% 100%; animation: flick .95s ease-in-out 3; }
.flame.big.celebrate .fi { transform-origin: 50% 100%; animation: flick2 .7s ease-in-out 4; }
.flame.big.celebrate .fc { transform-origin: 50% 100%; animation: flick3 .55s ease-in-out 5; }
.flame.big.celebrate { animation: ignite 1.2s cubic-bezier(.34, 1.4, .64, 1) both, glow 1.4s ease-in-out 1.2s 2; transform-origin: 50% 90%; }
@keyframes ignite { 0% { transform: scale(.4); opacity: 0; } 55% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
.flame .embers circle { opacity: 0; transform-box: fill-box; transform-origin: center; }
.flame.big.on .embers circle { animation: ember 2.6s ease-out infinite; }
.p-hero.risk .flame-box .flame { animation: none; filter: saturate(.7) brightness(.9) drop-shadow(0 6px 16px rgba(255,110,25,.22)); }
.p-hero.risk .flame-box .flame .embers { display: none; }
@keyframes sway { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-1.6deg); } 65% { transform: rotate(1.3deg); } }
@keyframes flick { 0%,100% { transform: scale(1, 1) skewX(0); } 22% { transform: scale(.975, 1.04) skewX(-1.6deg); } 48% { transform: scale(1.02, .975) skewX(1.2deg); } 74% { transform: scale(.985, 1.025) skewX(-.7deg); } }
@keyframes flick2 { 0%,100% { transform: scale(1, 1) skewX(0); } 35% { transform: scale(.94, 1.07) skewX(1.5deg); } 68% { transform: scale(1.04, .95) skewX(-1deg); } }
@keyframes flick3 { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(.9, 1.12); } }
@keyframes glow { 0%,100% { filter: drop-shadow(0 8px 20px rgba(255,110,25,.42)); } 50% { filter: drop-shadow(0 8px 32px rgba(255,120,30,.68)); } }
@keyframes ember { 0% { opacity: 0; transform: translate(0, 18px) scale(.6); } 20% { opacity: .95; } 100% { opacity: 0; transform: translate(4px, -26px) scale(1); } }
.fnum {
  font: 900 54px/1 "SF Pro Rounded", ui-rounded, "Arial Rounded MT Bold", "Nunito", var(--f-ui);
  stroke: #d63c0a; stroke-width: 11px; stroke-linejoin: round; paint-order: stroke fill; letter-spacing: -1px;
  transform-box: fill-box; transform-origin: 50% 70%; font-variant-numeric: tabular-nums;
}
.flame.off .fnum { stroke: #5f5f64; }
.fnum.pop { animation: numpop .6s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes numpop { 0% { transform: scale(1); } 40% { transform: scale(1.28); } 100% { transform: scale(1); } }
.p-hero::before { inset: -10% auto auto -12%; width: 75%; background: radial-gradient(circle, rgba(242,120,40,.28), transparent 62%); }
.streak-title { font: 600 24px/1.15 var(--f-display); letter-spacing: -.01em; }
.hero-status { margin: 6px 0 0; font-size: 14px; line-height: 1.4; color: var(--fg-2); text-wrap: pretty; }
.goal-bar { margin-top: 14px; display: grid; gap: 6px; }
.gb-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.gb { height: 6px; border-radius: 3px; background: var(--fill-2); overflow: hidden; }
.gb i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #ff6a1f, #ffb12e); transition: width 1.2s cubic-bezier(.22, 1, .36, 1) .25s; }
.p-hero.off .gb i { background: var(--fg-3); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 18px; position: relative; }
.wd { display: grid; justify-items: center; gap: 6px; animation: rise .5s var(--ease) backwards; animation-delay: calc(.25s + var(--i) * 45ms); }
.wd .dot { width: 34px; height: 34px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; }
.wd .dot.part { box-shadow: inset 0 0 0 2px rgba(242,138,46,.55); }
.wd .dot.met { background: rgba(242,138,46,.16); }
.wd .dot .flame { width: 19px; height: 24px; }
.wd .dot .flame .fo, .wd .dot .flame .fi, .wd .dot .flame .fc { animation: none; }
.wd .wl { font-size: 12px; color: var(--fg-3); }
.wd.today .wl { color: var(--fg); font-weight: 600; }
.wd.today .dot { box-shadow: 0 0 0 2px var(--bg-raised), 0 0 0 3.5px var(--fg-3); }
.wd.today .dot.met { box-shadow: 0 0 0 2px var(--bg-raised), 0 0 0 3.5px #f28a2e; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (min-width: 760px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
.stile { padding: 14px 16px 15px; display: grid; gap: 4px; align-content: start; animation: rise .55s var(--ease) backwards; animation-delay: calc(.1s + var(--i) * 60ms); }
.stile .tl { font-size: 13px; color: var(--fg-2); }
.stile b { font: 600 26px/1.15 var(--f-display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.stile .ts { font-size: 12.5px; color: var(--fg-3); line-height: 1.3; }

.seg.mini button { min-height: 30px; font-size: 13px; padding: 0 10px; }
.sum { margin: 0 0 14px; color: var(--fg-2); font-size: 14px; }
.sum b { color: var(--fg); font-size: 15px; }
.chart { position: relative; height: 150px; margin-top: 52px; }
.plot { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n), 1fr); align-items: end; gap: 2px; border-bottom: 1px solid var(--hair); }
.col { height: 100%; display: flex; align-items: flex-end; justify-content: center; padding: 0 2px; border-radius: 6px; position: relative; z-index: 1; }
.col .barv { width: 100%; max-width: 28px; border-radius: 4px 4px 1px 1px; background: var(--fg-3); transform-origin: bottom; animation: grow .7s cubic-bezier(.22, 1, .36, 1) backwards; animation-delay: calc(.15s + var(--i) * 30ms); transition: background .2s; }
.col.met .barv { background: linear-gradient(180deg, #ffb43b, #e8562a); }
.col.today .barv { box-shadow: 0 0 0 1.5px var(--bg-raised), 0 0 0 3px var(--fg-3); }
.col.sel { background: var(--fill); }
@keyframes grow { from { transform: scaleY(0); } }
.goal-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px dashed rgba(242,138,46,.65); z-index: 2; pointer-events: none; }
.goal-line span { position: absolute; right: 0; bottom: 3px; font-size: 11px; color: var(--fg-3); background: var(--bg-raised); padding: 0 0 0 6px; }
.ctip { position: absolute; top: -30px; transform: translate(-50%, -100%); z-index: 5; display: grid; gap: 1px; justify-items: center; padding: 6px 10px; border-radius: 10px; background: var(--pill); color: var(--pill-fg); font-size: 12px; white-space: nowrap; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
.ctip b { font-size: 14px; }
.ctip { top: 0; }
.chart-empty { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; color: var(--fg-3); font-size: 14px; text-align: center; padding: 0 20px; z-index: 3; }
.xaxis { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; margin-top: 6px; font-size: 11px; color: var(--fg-3); text-align: center; font-variant-numeric: tabular-nums; }

.blist { display: grid; }
.brow { display: grid; grid-template-columns: 42px 1fr auto; gap: 14px; align-items: center; padding: 10px 0; text-align: left; animation: rise .5s var(--ease) backwards; animation-delay: calc(.2s + var(--i) * 50ms); }
.brow + .brow { box-shadow: inset 0 .5px 0 var(--hair); }
.brow .bm { display: grid; gap: 3px; min-width: 0; }
.brow .bt { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brow .bs { font-size: 12.5px; color: var(--fg-2); }
.brow .share { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; margin-top: 3px; }
.brow .share i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #f28a2e, #ffb43b); transition: width 1s cubic-bezier(.22, 1, .36, 1) .3s; }
.brow .bpct { font-size: 13px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.records { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.rec { padding: 14px 12px; display: grid; gap: 4px; text-align: center; }
.rec b { font: 600 18px/1.2 var(--f-display); }
.rec span { font-size: 12px; color: var(--fg-3); }

.col .barv.zero { box-shadow: none !important; }

/* install */
.install { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; padding: 12px 8px 12px 12px; margin-bottom: 22px; }
.install img { width: 44px; height: 44px; border-radius: 11px; }
.install b { display: block; font-size: 15px; }
.install span { display: block; font-size: 12.5px; color: var(--fg-2); line-height: 1.3; margin-top: 2px; }
.install .btn { min-height: 36px; padding: 0 14px; font-size: 14px; }
.install .icon-btn { width: 36px; height: 36px; color: var(--fg-3); }
.steps { margin: 6px 0 4px; padding-left: 22px; display: grid; gap: 10px; font-size: 16px; line-height: 1.4; }

/* ---------- motion pass ---------- */
/* segmented controls: one pill slides under the labels */
.seg.pill { position: relative; isolation: isolate; }
.seg.pill::before {
  content: ""; position: absolute; z-index: -1; top: 2px; bottom: 2px; left: 2px;
  width: calc((100% - 4px - (var(--n) - 1) * 2px) / var(--n));
  border-radius: 8px; background: var(--seg-on); box-shadow: 0 1px 3px rgba(0,0,0,.2);
  transform: translate3d(calc(var(--idx) * (100% + 2px)), 0, 0);
  transition: transform .42s cubic-bezier(.32, .72, 0, 1);
}
.seg.pill.none::before { opacity: 0; }
.seg.pill button[aria-pressed="true"], .seg.pill button[aria-selected="true"] { background: transparent; box-shadow: none; }
.seg.pill button { transition: color .25s, transform .2s var(--ease); }
.seg.pill button:active { transform: scale(.96); }
.type .seg.pill::before { border-radius: 9px; }

/* library navigation */
@keyframes nav-push { from { opacity: 0; transform: translate3d(36px, 0, 0); } to { opacity: 1; transform: none; } }
@keyframes nav-pop { from { opacity: 0; transform: translate3d(-36px, 0, 0); } to { opacity: 1; transform: none; } }
.nav-push, .nav-right, .push-in { animation: nav-push .42s cubic-bezier(.32, .72, 0, 1) both; }
.nav-pop, .nav-left, .pop-back { animation: nav-pop .42s cubic-bezier(.32, .72, 0, 1) both; }

/* book detail and sheet content */
@keyframes cover-in { from { opacity: 0; transform: translate3d(0, 14px, 0) scale(.92); } to { opacity: 1; transform: none; } }
.detail .cv { animation: cover-in .55s cubic-bezier(.34, 1.3, .64, 1) .06s backwards; }
.detail .acts, .detail > div:last-child { animation: rise .5s var(--ease) .12s backwards; }
.sheet .menu-list button, .pick li, .toc li, .res li { animation: rise .4s var(--ease) backwards; }
.sheet .pick li:nth-child(n+2), .sheet .toc li:nth-child(n+2) { animation-delay: 30ms; }
.sheet .pick li:nth-child(n+4), .sheet .toc li:nth-child(n+4) { animation-delay: 60ms; }
.sheet .pick li:nth-child(n+6), .sheet .toc li:nth-child(n+6) { animation-delay: 90ms; }
.annot { transition: max-height .5s cubic-bezier(.32, .72, 0, 1); }
.font-card { transition: box-shadow .2s, background .2s, transform .2s var(--ease); }
.font-card:active, .size-btn:active, .rb-ch:active, .back-link:active, .sort-btn:active { transform: scale(.95); }
.size-btn, .rb-ch, .back-link, .sort-btn, .chip { transition: transform .18s var(--ease), background .2s, color .2s; }
.btn:active { transform: scale(.97); }
.link-btn { transition: opacity .2s; } .link-btn:active { opacity: .55; }

/* reader */
@keyframes top-swap { from { opacity: 0; transform: translate3d(0, -6px, 0); } to { opacity: 1; transform: none; } }
.top-swap { animation: top-swap .3s var(--ease) both; }
@keyframes q-new { 0% { background-color: color-mix(in srgb, var(--accent) 70%, transparent); } 100% { background-color: color-mix(in srgb, var(--accent) 22%, transparent); } }
.r-content mark.q.q-new { animation: q-new .9s ease-out; }
.rb-tip { transform-origin: 50% 100%; }
.rb-tip.pop-in { animation: tip-in .2s var(--ease) both; }
@keyframes tip-in { from { opacity: 0; transform: translate(-50%, 6px) scale(.9); } to { opacity: 1; transform: translate(-50%, 0); } }
.fly { border-radius: 4px; box-shadow: 0 24px 60px rgba(0,0,0,.5); will-change: transform, opacity; overflow: hidden; }
.r-bottom .icon-btn, .r-top .icon-btn { transition: transform .15s var(--ease), background .15s; }

/* profile bars grow with transforms instead of width */
.brow .share i { transform-origin: left center; transition: none; animation: grow-x 1s cubic-bezier(.22, 1, .36, 1) backwards; animation-delay: calc(.3s + var(--i, 0) * 60ms); }
.gb i { transform-origin: left center; transition: none; animation: grow-x 1.1s cubic-bezier(.22, 1, .36, 1) .25s backwards; }
@keyframes grow-x { from { transform: scaleX(0); } }

/* theme switches cross-fade */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .38s; animation-timing-function: ease; }

/* reorder by long-press */
.bgrid { position: relative; }
.bgrid.sortable .bcell { -webkit-touch-callout: none; touch-action: manipulation; }
.bgrid.sortable .bcell img { -webkit-user-drag: none; pointer-events: none; }
.bcell.lifted { position: relative; z-index: 60; pointer-events: none; transition: none; }
.bcell.lifted .bc { transform: none !important; }
.bcell.lifted .cover { box-shadow: 0 2px 4px rgba(0,0,0,.35), 0 26px 50px rgba(0,0,0,.55); }
.bcell.lifted .bt, .bcell.lifted .ba, .bcell.lifted .bp { opacity: 0; transition: opacity .15s; }
.bgrid.dragging .bcell:not(.lifted) { opacity: .82; transition: opacity .25s; }
@keyframes jiggle { from { rotate: -.7deg; } to { rotate: .7deg; } }
.reorder-hint { margin: 26px 0 0; text-align: center; font-size: 13px; color: var(--fg-3); }

/* the library is an app surface: no text selection or long-press callouts (the reader keeps them) */
.lib, .lib * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.lib input, .lib textarea { -webkit-user-select: text; user-select: text; }
.bcell.pressing .bc { transform: scale(.97); transition: transform .36s ease-out; }

/* ---------- book page ---------- */
.book-sheet .sheet-head { display: none; }
.book-sheet .grab { position: absolute; top: 0; left: 0; right: 0; z-index: 5; }
.book-sheet .grab::before { background: rgba(255,255,255,.45); }
.book-sheet .sheet-body { padding: 0; display: flex; flex-direction: column; }
.book-sheet { overflow: hidden; }
.bd { display: flex; flex-direction: column; min-height: 100%; }
.bh { position: relative; height: 250px; flex: none; display: grid; place-items: end center; }
/* the blurred cover fades out through a mask, so it melts into the page instead of ending on a line */
.bh-bg { position: absolute; left: 0; right: 0; top: 0; height: calc(100% + 110px); z-index: 0; overflow: hidden; pointer-events: none;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.85) 45%, rgba(0,0,0,.35) 72%, transparent 100%);
          mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.85) 45%, rgba(0,0,0,.35) 72%, transparent 100%); }
.bh-bg .cover { position: absolute; inset: -50px; width: auto; height: auto; aspect-ratio: auto; border-radius: 0; box-shadow: none; filter: blur(32px) saturate(1.5); opacity: .8; }
.bh-bg .cover::after { display: none; }
.bh::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 120px; z-index: 1; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.22), transparent); }
.bh-bar { position: absolute; top: 14px; left: 12px; right: 12px; z-index: 3; display: flex; justify-content: space-between; }
.bh-btn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: #fff; background: rgba(0,0,0,.28); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: transform .15s var(--ease); }
.bh-btn:active { transform: scale(.92); }
.bh .cv { position: relative; z-index: 2; width: 132px; margin-bottom: -28px; animation: cover-in .6s cubic-bezier(.34, 1.3, .64, 1) .05s backwards; }
.bh .cv .cover { box-shadow: 0 2px 4px rgba(0,0,0,.3), 0 18px 40px rgba(0,0,0,.45); }
.bd-main { position: relative; z-index: 1; padding: 40px 20px 8px; display: grid; justify-items: center; text-align: center; gap: 4px; animation: rise .5s var(--ease) .1s backwards; }
.bd-main h3 { font: 600 23px/1.2 var(--f-display); margin: 4px 0 0; text-wrap: balance; }
.bd-main .au { color: var(--fg-2); font-size: 15px; }
.tiles3 { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
.bt-tile { display: grid; gap: 6px; justify-items: center; padding: 12px 6px; border-radius: 14px; background: var(--bg-raised); box-shadow: inset 0 0 0 1px var(--hair); }
.btl { font-size: 12px; color: var(--fg-3); }

.pc-t { font: 600 16px/1.25 var(--f-display); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.pc-bar { height: 5px; border-radius: 3px; background: var(--fill-2); overflow: hidden; }
.pc-bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); transform-origin: left; animation: grow-x 1s cubic-bezier(.22, 1, .36, 1) .2s backwards; }
.bd-acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
.pill-btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--fill); font-size: 14px; font-weight: 500; transition: transform .15s var(--ease), background .2s; max-width: 100%; }
.pill-btn:active { transform: scale(.95); background: var(--fill-2); }
.bd-h { justify-self: start; margin: 24px 0 6px; font-size: 18px; font-weight: 600; }
.bd-main .annot { text-align: left; }
.bd-main .link-btn { justify-self: start; }
.bd-main .group { width: 100%; text-align: left; }
.muted-l { color: var(--fg-3); font-size: 14px; }
.bd-cta { position: sticky; bottom: 0; margin-top: auto; padding: 18px 20px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, transparent, var(--sheet) 34%); z-index: 4; }
.btn.primary { min-height: 54px; font-size: 17px; border-radius: 16px; }

/* ---------- quotes page ---------- */
.q-filter { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: -4px 0 18px; padding-bottom: 2px; }
.q-filter::-webkit-scrollbar { display: none; }
.q-filter .chip { box-shadow: inset 0 0 0 1px var(--hair); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-list { display: grid; gap: 14px; }
@media (min-width: 760px) { .q-list { grid-template-columns: 1fr 1fr; align-items: start; } }
.qcard { position: relative; background: var(--bg-raised); border-radius: 20px; padding: 6px 8px 8px; overflow: hidden; animation: rise .5s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 45ms); }
.qcard::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 64px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.q-body { display: block; width: 100%; text-align: left; padding: 12px 46px 6px 14px; border-radius: 14px; position: relative; transition: background .2s; }
.q-body:active { background: var(--fill); }
.q-mark { position: absolute; right: 8px; top: -10px; font: 700 84px/1 var(--f-display); color: var(--accent); opacity: .16; pointer-events: none; }
.q-text { display: -webkit-box; -webkit-line-clamp: 9; -webkit-box-orient: vertical; overflow: hidden; font: 400 17px/1.55 var(--f-display); color: var(--fg); text-wrap: pretty; }
.q-foot { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 2px; padding: 8px 4px 0 10px; border-top: 1px solid var(--hair); margin-top: 8px; }
.q-book { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; text-align: left; min-width: 0; padding: 4px 0; }
.q-book .cover { width: 28px; border-radius: 2px 3px 3px 2px; }
.q-book span { min-width: 0; display: grid; }
.q-book b { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-book small { font-size: 12px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-foot .icon-btn { width: 40px; height: 40px; color: var(--fg-2); }
.q-empty-mark { font: 700 110px/.8 var(--f-display); color: var(--accent); opacity: .55; height: 60px; margin-bottom: 4px; }

/* quote groups: one stack per book */
.qgroup { position: relative; display: block; width: 100%; text-align: left; animation: rise .5s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 50ms); transition: transform .2s var(--ease); }
.qgroup:active { transform: scale(.98); }
.qgroup.stacked { padding-bottom: 8px; }
.qgroup.stacked2 { padding-bottom: 15px; }
.qgroup.stacked::before, .qgroup.stacked2::after {
  content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 30px; border-radius: 0 0 18px 18px;
  background: var(--bg-raised-2); box-shadow: inset 0 -1px 0 var(--hair);
}
.qgroup.stacked::before { bottom: 0; left: 12px; right: 12px; }
.qgroup.stacked2::before { bottom: 7px; }
.qgroup.stacked2::after { left: 26px; right: 26px; opacity: .55; }
.qg-card { position: relative; z-index: 1; display: grid; gap: 12px; padding: 14px 14px 16px; border-radius: 20px; background: var(--bg-raised); box-shadow: 0 1px 0 var(--hair); }
.qg-top { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; }
.qg-top .cover { width: 34px; border-radius: 2px 3px 3px 2px; }
.qg-meta { min-width: 0; display: grid; }
.qg-meta b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qg-meta small { font-size: 12.5px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qg-count { display: inline-flex; align-items: center; gap: 2px; min-width: 28px; height: 28px; padding: 0 4px 0 10px; border-radius: 14px; background: var(--fill); color: var(--accent-ink); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.qg-count .ic { color: var(--fg-3); width: 16px; height: 16px; }

.qg-q { position: relative; display: block; }
.qg-q .q-mark { right: 2px; top: -10px; font-size: 64px; line-height: 1; }
.qb-head { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; width: 100%; text-align: left; margin: -2px 0 18px; }
.qb-head .cover { width: 52px; }
.qb-head span { display: grid; gap: 2px; min-width: 0; }
.qb-head b { font: 600 20px/1.2 var(--f-display); }
.qb-head small { color: var(--fg-2); font-size: 14px; }
.q-when { font-size: 12.5px; color: var(--fg-3); padding-left: 4px; }

/* ---------- bottom tab bar ---------- */
.tabbar {
  position: fixed; z-index: 50; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  display: grid; grid-template-columns: repeat(4, 56px); gap: 6px; padding: 6px; border-radius: 34px;
  background: color-mix(in srgb, var(--bg-raised) 82%, transparent);
  -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
  box-shadow: 0 10px 34px rgba(0,0,0,.35), inset 0 0 0 .5px var(--hair), inset 0 1px 0 rgba(255,255,255,.06);
  --ti: 0;
}
.tabbar button { position: relative; z-index: 1; width: 56px; height: 52px; border-radius: 26px; display: grid; place-items: center; color: var(--fg-2); transition: color .3s ease; }

.tabbar button:active .ic { transform: scale(.88); }
.tabbar .ic { transition: transform .2s var(--ease); }
.tb-ind {
  position: absolute; z-index: 0; top: 6px; left: 6px; width: 56px; height: 52px; border-radius: 26px; background: var(--pill);
  box-shadow: 0 4px 14px rgba(0,0,0,.25);
  transform: translate3d(calc(var(--ti) * 62px), 0, 0);
  transition: transform .52s cubic-bezier(.34, 1.42, .52, 1);
}
@keyframes tb-pop { 0% { transform: scale(1); } 35% { transform: scale(.82); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
.tabbar button.tb-pop .ic { animation: tb-pop .45s var(--ease); }
.lib { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.toasts { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
.reader:not([hidden]) ~ .toasts, body:has(#reader:not([hidden])) .toasts { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
@keyframes tab-r { from { opacity: 0; transform: translate3d(22px, 0, 0) scale(.99); } to { opacity: 1; transform: none; } }
@keyframes tab-l { from { opacity: 0; transform: translate3d(-22px, 0, 0) scale(.99); } to { opacity: 1; transform: none; } }
.tab-r { animation: tab-r .3s cubic-bezier(.2, .8, .2, 1) both; }
.tab-l { animation: tab-l .3s cubic-bezier(.2, .8, .2, 1) both; }

/* ---------- minimal chrome: avatar, round buttons, compact tabs + add button ---------- */
.navbar { grid-template-columns: auto 1fr auto; padding-right: max(16px, env(safe-area-inset-right, 0px)); height: 60px; }

.navbar .end { gap: 8px; }

.avatar .ic { width: 20px; height: 20px; }
.round-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--fg); background: var(--bg-raised); box-shadow: inset 0 0 0 1px var(--hair), 0 2px 8px rgba(0,0,0,.18); transition: transform .15s var(--ease), background .2s; }
.round-btn[aria-expanded="true"] { background: var(--pill); color: var(--pill-fg); }
.avatar:active, .round-btn:active, .fab:active { transform: scale(.92); }
.profile .navbar .round-btn { justify-self: start; }
@keyframes search-in { from { opacity: 0; transform: translate3d(0, -8px, 0); } to { opacity: 1; transform: none; } }
.search-in { animation: search-in .28s var(--ease) both; }

.tabbar { left: max(16px, env(safe-area-inset-left, 0px)); transform: none; grid-template-columns: repeat(3, 52px); gap: 4px; padding: 5px; border-radius: 30px; }
.tabbar button { width: 52px; height: 48px; border-radius: 24px; }
.tb-ind { top: 5px; left: 5px; width: 52px; height: 48px; border-radius: 24px; transform: translate3d(calc(var(--ti) * 56px), 0, 0); }
.fab {
  position: fixed; z-index: 50; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--pill); color: var(--pill-fg);
  box-shadow: 0 10px 28px rgba(0,0,0,.4); transition: transform .18s var(--ease);
}
.fab .ic { width: 26px; height: 26px; stroke-width: 2; }
.p-add {
  position: absolute; z-index: 3; right: 9%; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; background: #fff; color: #161617; box-shadow: 0 4px 12px rgba(0,0,0,.3); transition: transform .15s var(--ease);

  const coverKey = coverImg ? '#' + hrefOf(coverImg).replace(/^#/, '') : '';
  const { bodies, main } = fb2Bodies(root);
  if (!main) throw new Error('В FB2 нет текста книги');
  const chapters = [];
  const push = (o) => { const box = o.box; o.html = box.innerHTML; o.len = box.textContent.length; delete o.box; if (o.len || box.querySelector('img')) chapters.push(o); };
  // main body: leading part (title, epigraphs)
  const lead = [...main.children].filter((c) => c.localName !== 'section');
  if (lead.length) push({ kind: 'bodyhead', title: titleOf(main) || 'Начало', depth: 0, box: fb2Html(lead, -1) });
  const secs = fb2Sections(main);
  secs.forEach(({ sec, depth }, idx) => {
    const sub = kids(sec, 'section');
    if (!sub.length) push({ kind: 'leaf', sec: idx, depth, title: titleOf(sec), box: fb2Html([...sec.children], depth) });
    else {
      const leadKids = [...sec.children].filter((c) => c.localName !== 'section');
      if (leadKids.length) push({ kind: 'head', sec: idx, depth, title: titleOf(sec), box: fb2Html(leadKids, depth) });
    }
  });
  if (!secs.length && !lead.length) throw new Error('В FB2 нет текста книги');
  bodies.forEach((b, bi) => {
    if (b === main) return;
    const nm = (b.getAttribute('name') || '').toLowerCase();
    push({ kind: 'body', body: bi, depth: 0, title: nm === 'notes' ? 'Примечания' : nm === 'comments' ? 'Комментарии' : 'Приложение', box: fb2Html([...b.children], -1) });
  });
  chapters.forEach((c, i) => { if (!c.title) c.title = c.kind === 'bodyhead' ? 'Начало' : 'Глава ' + (i + 1); });
  const toc = chapters.map((c, i) => ({ title: c.title, ch: i, depth: Math.min(c.depth, 3) }));
  const book = {
    format: 'fb2', title: tx(kid(ti, 'book-title')) || meta.fileTitle || 'Без названия', authors, genres,
    series: seq ? seq.getAttribute('name') || '' : '', seriesNo: seq ? seq.getAttribute('number') || '' : '',
    lang: tx(kid(ti, 'lang')) || 'ru',
    annotation: ann ? [...ann.children].map(tx).filter(Boolean).join('\n\n') || tx(ann) : '',
    cover: coverKey && images[coverKey] ? images[coverKey] : null,
  };
  return { book, content: { chapters, toc, images, fb2Xml: text } };
}

/* ================= EPUB → reading model ================= */
function sanitizeInto(box) {
  box.querySelectorAll('script,style,link,meta,base,iframe,frame,object,embed,form,input,button,select,textarea,audio,video,noscript,title').forEach((e) => e.remove());
  for (const el of box.querySelectorAll('*')) {
    for (const a of [...el.attributes]) {
      const n = a.name.toLowerCase();
      if (n.startsWith('on') || n === 'style' || n === 'srcset' || n === 'contenteditable' || /^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name);
    }
  }
}
async function parseEpub(zip, meta = {}) {
  const cont = zip.file('META-INF/container.xml');
  if (!cont) throw new Error('В архиве нет книги EPUB');
  const cdoc = parseXml(await cont.async('string'));
  const rf = cdoc && cdoc.getElementsByTagNameNS('*', 'rootfile')[0];
  const opfPath = rf ? normPath(rf.getAttribute('full-path')) : '';
  const opfFile = opfPath && zip.file(opfPath);
  if (!opfFile) throw new Error('EPUB повреждён: нет описания книги');
  const opf = parseXml(await opfFile.async('string'));
  if (!opf) throw new Error('EPUB повреждён: описание книги не читается');
  const dc = (n) => [...opf.getElementsByTagNameNS(DCNS, n)].map(tx).filter(Boolean);
  const metas = [...opf.getElementsByTagNameNS('*', 'meta')];
  const metaName = (n) => { const m = metas.find((x) => x.getAttribute('name') === n); return m ? m.getAttribute('content') || '' : ''; };
  const manifest = {};
  const items = [...opf.getElementsByTagNameNS('*', 'item')];
  for (const it of items) manifest[it.getAttribute('id')] = { id: it.getAttribute('id'), path: resolvePath(opfPath, it.getAttribute('href') || ''), type: it.getAttribute('media-type') || '', props: it.getAttribute('properties') || '' };
  const all = Object.values(manifest);
  let coverItem = all.find((i) => i.props.split(/\s+/).includes('cover-image')) || manifest[metaName('cover')] || all.find((i) => /^image\//.test(i.type) && /cover/i.test(i.id + i.path));
  // images
  const images = {};
  for (const it of all) {
    if (!/^image\//.test(it.type)) continue;
    const f = zip.file(it.path);
    if (f) images[it.path] = new Blob([await f.async('arraybuffer')], { type: it.type });
  }
  // toc
  const tocEntries = [];
  const navItem = all.find((i) => i.props.split(/\s+/).includes('nav'));
  if (navItem && zip.file(navItem.path)) {
    const nd = parseXml(await zip.file(navItem.path).async('string'), 'application/xhtml+xml') || new DOMParser().parseFromString(await zip.file(navItem.path).async('string'), 'text/html');
    const navs = [...nd.getElementsByTagNameNS('*', 'nav')];
    const nav = navs.find((n) => /toc/.test(n.getAttribute('epub:type') || n.getAttributeNS('http://www.idpf.org/2007/ops', 'type') || '')) || navs[0];
    const walk = (ol, depth) => {
      for (const li of kids(ol, 'li')) {
        const a = li.getElementsByTagNameNS('*', 'a')[0];
        if (a && hrefOf(a)) tocEntries.push({ title: tx(a), target: resolvePath(navItem.path, hrefOf(a)), depth });
        const sub = kid(li, 'ol'); if (sub) walk(sub, depth + 1);
      }
    };
    const ol = nav && kid(nav, 'ol'); if (ol) walk(ol, 0);
  }
  if (!tocEntries.length) {
    const spineEl = opf.getElementsByTagNameNS('*', 'spine')[0];
    const ncx = manifest[spineEl && spineEl.getAttribute('toc')] || all.find((i) => i.type === 'application/x-dtbncx+xml');
    if (ncx && zip.file(ncx.path)) {
      const nd = parseXml(await zip.file(ncx.path).async('string'));
      const walk = (el, depth) => {
        for (const np of kids(el, 'navPoint')) {
          const c = kid(np, 'content');
          if (c) tocEntries.push({ title: tx(kid(kid(np, 'navLabel'), 'text')), target: resolvePath(ncx.path, c.getAttribute('src') || ''), depth });
          walk(np, depth + 1);
        }
      };
      const map = nd && nd.getElementsByTagNameNS('*', 'navMap')[0];
      if (map) walk(map, 0);
    }
  }

  const chapters = [];
  const refs = [...opf.getElementsByTagNameNS('*', 'itemref')];
  for (const ref of refs) {
    const it = manifest[ref.getAttribute('idref')];
    if (!it || !zip.file(it.path) || !/html|xml/.test(it.type)) continue;
    const src = await zip.file(it.path).async('string');
    const xd = parseXml(src, 'application/xhtml+xml') || new DOMParser().parseFromString(src, 'text/html');
    const body = xd.getElementsByTagNameNS('*', 'body')[0] || xd.body;
    if (!body) continue;
    const box = h('div');
    for (const c of [...body.childNodes]) box.append(document.importNode(c, true));
    sanitizeInto(box);
    for (const img of box.querySelectorAll('img')) { const s = img.getAttribute('src'); img.removeAttribute('src'); if (s) img.setAttribute('data-src', resolvePath(it.path, s)); }
    for (const im of box.querySelectorAll('image')) {
      const s = im.getAttributeNS(XLINK, 'href') || im.getAttribute('href');
      im.removeAttributeNS(XLINK, 'href'); im.removeAttribute('href');
      if (s) im.setAttribute('data-src', resolvePath(it.path, s));
    }
    for (const a of box.querySelectorAll('a[href]')) {
      const v = a.getAttribute('href');
      if (/^(https?:|mailto:)/i.test(v)) continue;
      a.removeAttribute('href');
      a.setAttribute('data-href', resolvePath(it.path, v));
    }
    const hd = box.querySelector('h1,h2,h3');
    chapters.push({ kind: 'file', path: it.path, html: box.innerHTML, len: box.textContent.length, title: '', heading: hd ? tx(hd).slice(0, 120) : '', depth: 0 });
  }
  if (!chapters.length) throw new Error('В EPUB не нашлось глав');
  const byPath = new Map(chapters.map((c, i) => [c.path, i]));
  const toc = [];
  for (const e of tocEntries) {
    const [p, frag] = e.target.split('#');
    if (!byPath.has(p) || !e.title) continue;
    const ch = byPath.get(p);
    toc.push({ title: e.title, ch, anchor: frag || '', depth: Math.min(e.depth, 3) });
    if (!chapters[ch].title) chapters[ch].title = e.title;
  }
  chapters.forEach((c, i) => {
    if (!c.title) {
      // inherit the nearest previous toc title so the bar always says where you are
      c.title = c.heading || (i > 0 ? chapters[i - 1].title : '') || 'Начало';
    }
    delete c.heading;
  });
  if (!toc.length) chapters.forEach((c, i) => toc.push({ title: c.title, ch: i, anchor: '', depth: 0 }));
  const genres = dc('subject');
  const seriesMeta = metas.find((m) => m.getAttribute('property') === 'belongs-to-collection');
  let seriesNo = metaName('calibre:series_index');
  if (seriesMeta && !seriesNo) { const id = seriesMeta.getAttribute('id'); const gp = id && metas.find((m) => m.getAttribute('refines') === '#' + id && m.getAttribute('property') === 'group-position'); if (gp) seriesNo = tx(gp); }
  const descRaw = dc('description')[0] || '';
  const descText = descRaw ? new DOMParser().parseFromString(descRaw, 'text/html').body.textContent.trim() : '';
  const book = {
    format: 'epub', title: dc('title')[0] || meta.fileTitle || 'Без названия', authors: dc('creator'), genres,
    series: metaName('calibre:series') || (seriesMeta ? tx(seriesMeta) : ''), seriesNo: seriesNo ? String(parseFloat(seriesNo) || seriesNo) : '',
    lang: dc('language')[0] || 'ru', annotation: descText,
    cover: coverItem && images[coverItem.path] ? images[coverItem.path] : null,
  };
  return { book, content: { chapters, toc, images, opfPath } };
}

/* ================= entry point ================= */
async function parseFile(file) {
  const buf = await file.arrayBuffer();
  const u8 = new Uint8Array(buf, 0, Math.min(4, buf.byteLength));
  const isZip = u8[0] === 0x50 && u8[1] === 0x4b;
  const fileTitle = stripExt(file.name);
  let res;
  if (isZip) {
    if (typeof JSZip === 'undefined') throw new Error('Не загрузился модуль для архивов — проверьте интернет и обновите страницу');
    let zip;
    try { zip = await JSZip.loadAsync(buf); } catch (e) { throw new Error('Архив повреждён'); }
    if (zip.file('META-INF/container.xml')) {
      res = await parseEpub(zip, { fileTitle });
      res.content.source = new Blob([buf], { type: 'application/epub+zip' });
    } else {
      const f = Object.values(zip.files).find((z) => !z.dir && /\.fb2$/i.test(z.name));
      if (!f) throw new Error('В архиве нет FB2 или EPUB');
      res = parseFb2Text(decodeText(await f.async('arraybuffer')), { fileTitle });
    }
  } else {
    const text = decodeText(buf);
    if (!/<FictionBook/i.test(text.slice(0, 4000))) throw new Error('Формат не поддерживается');
    res = parseFb2Text(text, { fileTitle });
  }
  const now = Date.now();
  Object.assign(res.book, {
    id: uid(), fileName: file.name, size: file.size, addedAt: now, openedAt: 0, progress: null, bookmarks: [],
    shelf: shelfFromGenres(res.book.genres), modifiedAt: 0, edits: 0, coverChanged: false,
  });
  res.content.id = res.book.id;
  return res;
}

/* ================= reading model → FB2 ================= */
function htmlToFb2(container, xdoc) {
  const X = (n) => xdoc.createElementNS(FB2NS, n);
  const inline = (src, target) => {
    for (const n of src.childNodes) {
      if (n.nodeType === 3) { target.append(xdoc.createTextNode(n.nodeValue)); continue; }
      if (n.nodeType !== 1) continue;
      const t = n.tagName;
      let el = null;
      if (t === 'EM' || t === 'I') el = X('emphasis');
      else if (t === 'STRONG' || t === 'B') el = X('strong');
      else if (t === 'S' || t === 'STRIKE' || t === 'DEL') el = X('strikethrough');
      else if (t === 'SUP' || t === 'SUB' || t === 'CODE') el = X(t.toLowerCase());
      else if (t === 'A') { el = X('a'); el.setAttributeNS(XLINK, 'l:href', n.getAttribute('data-href') || n.getAttribute('href') || ''); if (n.classList.contains('note')) el.setAttribute('type', 'note'); }
      else if (t === 'IMG') { const im = X('image'); im.setAttributeNS(XLINK, 'l:href', n.getAttribute('data-src') || ''); target.append(im); continue; }
      else if (t === 'BR') { target.append(xdoc.createTextNode(' ')); continue; }
      if (!el) { inline(n, target); continue; }
      inline(n, el); target.append(el);
    }
  };
  const lines = (el, tag) => {
    // split a block at <br> into several FB2 paragraphs
    const out = []; let cur = document.createElement('span');
    for (const c of [...el.childNodes]) {
      if (c.nodeName === 'BR') { out.push(cur); cur = document.createElement('span'); } else cur.append(c.cloneNode(true));
    }
    out.push(cur);
    return out.filter((s) => s.textContent.trim() || s.querySelector('img')).map((s) => { const p = X(tag); inline(s, p); return p; });
  };
  const isBlockish = (el) => !!el.querySelector('p,div,h1,h2,h3,h4,h5,h6,blockquote,section,table,ul,ol,figure');
  const blocks = (src, ctx = '') => {
    const out = [];
    for (const n of src.childNodes) {
      if (n.nodeType === 3) { if (n.nodeValue.trim()) { const p = X(ctx === 'stanza' ? 'v' : 'p'); p.append(xdoc.createTextNode(n.nodeValue.trim())); out.push(p); } continue; }
      if (n.nodeType !== 1) continue;
      const t = n.tagName, cl = n.classList;
      let el = null;
      if (t === 'SECTION') { el = X('section'); blocks(n).forEach((c) => el.append(c)); if (!el.firstChild) el.append(X('empty-line')); }
      else if (/^H[1-6]$/.test(t)) { el = X('title'); lines(n, 'p').forEach((p) => el.append(p)); if (!el.firstChild) continue; }
      else if (t === 'P' || t === 'LI') {
        if (cl.contains('empty') || (!n.textContent.trim() && !n.querySelector('img'))) { out.push(X('empty-line')); continue; }
        const only = n.children.length === 1 && n.firstElementChild.tagName === 'IMG' && !n.textContent.trim();
        if (only) { el = X('image'); el.setAttributeNS(XLINK, 'l:href', n.firstElementChild.getAttribute('data-src') || ''); }
        else if (cl.contains('ptitle')) { el = X('title'); lines(n, 'p').forEach((p) => el.append(p)); }
        else {
          const tag = cl.contains('subtitle') ? 'subtitle' : cl.contains('author') ? 'text-author' : cl.contains('date') ? 'date' : (cl.contains('v') || ctx === 'stanza') ? 'v' : 'p';
          if (tag === 'subtitle' || tag === 'date' || tag === 'text-author') { el = X(tag); inline(n, el); }
          else { lines(n, tag).forEach((p) => out.push(p)); continue; }
        }
      }
      else if (t === 'BLOCKQUOTE') { el = X(cl.contains('epigraph') ? 'epigraph' : 'cite'); blocks(n).forEach((c) => el.append(c)); }
      else if (t === 'DIV' && cl.contains('poem')) { el = X('poem'); blocks(n, 'poem').forEach((c) => el.append(c)); }
      else if (t === 'DIV' && cl.contains('stanza')) { el = X('stanza'); blocks(n, 'stanza').forEach((c) => el.append(c)); }
      else if (t === 'DIV' && cl.contains('annotation')) { el = X('annotation'); blocks(n).forEach((c) => el.append(c)); }
      else if (t === 'IMG') { el = X('image'); el.setAttributeNS(XLINK, 'l:href', n.getAttribute('data-src') || ''); }
      else if ((t === 'DIV' && cl.contains('img')) || t === 'FIGURE') { const im = n.querySelector('img'); if (!im) continue; el = X('image'); el.setAttributeNS(XLINK, 'l:href', im.getAttribute('data-src') || ''); }
      else if (t === 'TABLE') {
        el = X('table');
        for (const tr of n.querySelectorAll('tr')) { const r = X('tr'); for (const c of tr.children) { const cell = X(c.tagName === 'TH' ? 'th' : 'td'); inline(c, cell); r.append(cell); } el.append(r); }
      }
      else if (t === 'BR') continue;
      else if (t === 'UL' || t === 'OL' || t === 'DIV' || t === 'ARTICLE' || t === 'ASIDE' || t === 'HEADER' || t === 'FOOTER') {
        if (isBlockish(n) || t === 'UL' || t === 'OL') { blocks(n, ctx).forEach((c) => out.push(c)); continue; }
        lines(n, ctx === 'stanza' ? 'v' : 'p').forEach((p) => out.push(p)); continue;
      }
      else { const p = X(ctx === 'stanza' ? 'v' : 'p'); inline(n, p); if (p.textContent.trim()) out.push(p); continue; }
      const id = n.getAttribute('id'); if (id && el && el.localName !== 'title') el.setAttribute('id', id);
      if (el) out.push(el);
    }
    return out;
  };
  return blocks(container);
}

function setChildText(parent, name, text, before) {
  let el = kid(parent, name);
  if (!text) { if (el) el.remove(); return; }
  if (!el) { el = parent.ownerDocument.createElementNS(FB2NS, name); parent.insertBefore(el, before || null); }
  el.textContent = text;
}

async function buildFb2(book, content) {
  const doc = parseXml(content.fb2Xml);
  if (!doc) throw new Error('исходный FB2 содержит ошибки разметки');
  const root = doc.documentElement;
  const X = (n) => doc.createElementNS(FB2NS, n);
  const { bodies, main } = fb2Bodies(root);
  const secs = fb2Sections(main).map((s) => s.sec);
  const tmp = document.createElement('div');
  for (const ch of content.chapters) {
    if (!ch.edited) continue;
    tmp.innerHTML = ch.html;
    const nodes = htmlToFb2(tmp, doc);
    const replaceLead = (el) => {
      const first = kid(el, 'section');
      [...el.children].filter((c) => c.localName !== 'section').forEach((c) => c.remove());
      nodes.forEach((n) => el.insertBefore(n, first));
    };
    if (ch.kind === 'leaf') { const s = secs[ch.sec]; if (!s) continue; while (s.firstChild) s.firstChild.remove(); nodes.forEach((n) => s.append(n)); if (!s.firstChild) s.append(X('empty-line')); }
    else if (ch.kind === 'head') { const s = secs[ch.sec]; if (s) replaceLead(s); }
    else if (ch.kind === 'bodyhead') replaceLead(main);
    else if (ch.kind === 'body') { const b = bodies[ch.body]; if (!b) continue; while (b.firstChild) b.firstChild.remove(); nodes.forEach((n) => b.append(n)); }
  }
  // description
  let desc = kid(root, 'description');
  if (!desc) { desc = X('description'); root.insertBefore(desc, root.firstChild); }
  let ti = kid(desc, 'title-info');
  if (!ti) { ti = X('title-info'); desc.insertBefore(ti, desc.firstChild); }
  kids(ti, 'genre').forEach((g) => g.remove());
  kids(ti, 'author').forEach((a) => a.remove());
  let bt = kid(ti, 'book-title');
  if (!bt) { bt = X('book-title'); ti.append(bt); }
  bt.textContent = book.title;
  const genres = (book.genres && book.genres.length ? book.genres : ['prose_contemporary']);
  for (const g of genres) { const e = X('genre'); e.textContent = GENRE_BY_NAME[String(g).toLowerCase()] || g; ti.insertBefore(e, ti.firstChild && kid(ti, 'author') ? kid(ti, 'author') : bt); }
  const authors = book.authors.length ? book.authors : [''];
  for (const a of authors) {
    const e = X('author'); const parts = a.trim().split(/\s+/).filter(Boolean);
    if (parts.length >= 2) {
      const f = X('first-name'); f.textContent = parts[0]; e.append(f);
      if (parts.length > 2) { const m = X('middle-name'); m.textContent = parts.slice(1, -1).join(' '); e.append(m); }
      const l = X('last-name'); l.textContent = parts[parts.length - 1]; e.append(l);
    } else { const n = X('nickname'); n.textContent = parts[0] || 'Неизвестный автор'; e.append(n); }
    ti.insertBefore(e, bt);
  }
  // reorder genres to top
  kids(ti, 'genre').reverse().forEach((g) => ti.insertBefore(g, ti.firstChild));
  kids(ti, 'annotation').forEach((a) => a.remove());
  if (book.annotation) {
    const an = X('annotation');
    for (const para of book.annotation.split(/\n\s*\n|\n/).map((s) => s.trim()).filter(Boolean)) { const p = X('p'); p.textContent = para; an.append(p); }
    ti.insertBefore(an, bt.nextSibling);
  }
  const anchorFor = () => kid(ti, 'src-lang') || kid(ti, 'translator') || kid(ti, 'sequence');
  setChildText(ti, 'lang', book.lang || 'ru', anchorFor());
  kids(ti, 'sequence').forEach((s) => s.remove());
  if (book.series) { const s = X('sequence'); s.setAttribute('name', book.series); if (book.seriesNo) s.setAttribute('number', book.seriesNo); ti.append(s); }
  if (book.coverChanged && book.cover) {
    const ext = book.cover.type === 'image/png' ? 'png' : 'jpg';
    const id = 'polka-cover.' + ext;
    kids(root, 'binary').filter((b) => b.getAttribute('id') === id).forEach((b) => b.remove());
    const bin = X('binary'); bin.setAttribute('id', id); bin.setAttribute('content-type', book.cover.type === 'image/png' ? 'image/png' : 'image/jpeg');
    bin.textContent = await blobToB64(book.cover);
    root.append(bin);
    kids(ti, 'coverpage').forEach((c) => c.remove());
    const cp = X('coverpage'); const im = X('image'); im.setAttributeNS(XLINK, 'l:href', '#' + id); cp.append(im);
    ti.insertBefore(cp, kid(ti, 'lang'));
  }
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(root);
}

/* ================= reading model → EPUB ================= */
async function buildEpub(book, content) {
  const zip = await JSZip.loadAsync(await content.source.arrayBuffer());
  const ser = new XMLSerializer();
  for (const ch of content.chapters) {
    if (!ch.edited) continue;
    const f = zip.file(ch.path);
    const original = f ? await f.async('string') : '';
    let doc = original && parseXml(original, 'application/xhtml+xml');
    if (!doc) doc = parseXml(`<?xml version="1.0" encoding="utf-8"?><html xmlns="${XHTML}"><head><title>${escXml(ch.title)}</title></head><body></body></html>`, 'application/xhtml+xml');
    const body = doc.getElementsByTagNameNS('*', 'body')[0];
    while (body.firstChild) body.firstChild.remove();
    const tmp = document.createElement('div');
    tmp.innerHTML = ch.html;
    for (const img of tmp.querySelectorAll('img[data-src]')) { img.setAttribute('src', relPath(ch.path, img.getAttribute('data-src'))); img.removeAttribute('data-src'); if (!img.hasAttribute('alt')) img.setAttribute('alt', ''); }
    for (const im of tmp.querySelectorAll('image[data-src]')) { im.setAttributeNS(XLINK, 'xlink:href', relPath(ch.path, im.getAttribute('data-src'))); im.removeAttribute('data-src'); }
    for (const a of tmp.querySelectorAll('a[data-href]')) { a.setAttribute('href', relPath(ch.path, a.getAttribute('data-href'))); a.removeAttribute('data-href'); }

}

async function saveFile(name, blob) {

    catch (e) { if (e && e.code === 'declined') return; toast('Не удалось сохранить файл: ' + ((e && e.message) || 'сохранение недоступно'), { tone: 'error' }); }

  setTimeout(() => URL.revokeObjectURL(url), 5000);

async function exportBook(book) {
  const t = toast('Собираю файл…', { busy: true, timeout: 0 });
  try {
    const content = await DB.get('content', book.id);
    if (!content) throw new Error('текст книги не найден');
    const base = safeName(book.title);
    if (book.format === 'epub') {
      const blob = await buildEpub(book, content);
      t.close(); await saveFile(base + '.epub', blob);
    } else {
      const xml = await buildFb2(book, content);
      const inArtifact = !!(window.claude && typeof window.claude.use === 'function');
      if (inArtifact && typeof JSZip !== 'undefined') {
        // The artifact viewer only accepts common extensions, so FB2 goes out as the standard .fb2.zip
        const z = new JSZip(); z.file(base + '.fb2', xml);
        const blob = await z.generateAsync({ type: 'blob', compression: 'DEFLATE' });
        t.close(); await saveFile(base + '.fb2.zip', blob);
      } else { t.close(); await saveFile(base + '.fb2', new Blob([xml], { type: 'application/x-fictionbook+xml' })); }
    }
  } catch (e) {
    t.close();
    toast('Не получилось собрать файл: ' + (e.message || e), { tone: 'error', timeout: 6000 });
  }
}

const sheets = [];
function openSheet({ title, label, body, left, right, tall, onClose, closeBtn = true, cls = '' }) {
  const host = document.body;
  const lastFocus = document.activeElement;
  const scrim = h('div', { class: 'scrim' });
  const head = h('div', { class: 'sheet-head' },
    h('div', { class: 'l' }, left || null),
    h('h2', { id: 'sh-' + uid() }, title || ''),
    h('div', { class: 'r' }, right || (closeBtn ? h('button', { class: 'close', 'aria-label': 'Закрыть', onclick: () => api.close() }, icon('x', 'sm')) : null)));
  const bodyEl = h('div', { class: 'sheet-body' }, body);
  const panel = h('div', { class: 'sheet' + (tall ? ' tall' : '') + (cls ? ' ' + cls : ''), role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': $('h2', head).id },
    h('div', { class: 'grab', 'aria-hidden': 'true' }), head, bodyEl);
  if (label) panel.setAttribute('aria-label', label);
  let closed = false;
  const api = {
    panel, body: bodyEl,
    close(silent) {
      if (closed) return; closed = true;
      panel.classList.remove('in'); scrim.classList.remove('in');
      setTimeout(() => { panel.remove(); scrim.remove(); }, 380);
      const i = sheets.indexOf(api); if (i >= 0) sheets.splice(i, 1);
      if (!sheets.length) root.classList.remove('locked');
      if (!silent && onClose) onClose();
      if (lastFocus && lastFocus.focus) try { lastFocus.focus({ preventScroll: true }); } catch (e) { /* gone */ }
    },
  };
  scrim.addEventListener('click', () => api.close());

  let startY = null, dy = 0, t0 = 0;
  const down = (e) => {
    if (e.target.closest('button,input,textarea,a') || window.innerWidth >= 720) return;
    startY = e.clientY; dy = 0; t0 = performance.now(); panel.classList.add('drag');
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const move = (e) => { if (startY == null) return; dy = Math.max(0, e.clientY - startY); panel.style.transform = `translateY(${dy}px)`; };
  const up = () => {
    if (startY == null) return;
    const v = dy / Math.max(1, performance.now() - t0);

  requestAnimationFrame(() => { scrim.classList.add('in'); panel.classList.add('in'); });
  setTimeout(() => { const f = panel.querySelector('[autofocus]') || panel.querySelector('.sheet-head button, .sheet-body button, input'); if (f) f.focus({ preventScroll: true }); }, 60);
  return api;
}
function confirmSheet({ title, text, ok, danger, cancel = 'Отмена' }) {

const PALETTE = [['#2f3e46', '#ebe5d6'], ['#6b2737', '#f3e6d6'], ['#1f3a5f', '#e8edf3'], ['#3d4a2f', '#ece6d2'], ['#7a4b1e', '#f6ead7'],

    if (e.touches.length > 1) { if (d) end(true); return; }
